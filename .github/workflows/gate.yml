name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm rebuild workerd esbuild
      - name: Unit, route and agent tests (includes a Worker bundle dry run)
        run: npm test
      - name: Site build
        run: node site/build.mjs
