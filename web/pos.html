<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>收银台 POS</title>
<link rel="icon" href="/img/logo.svg">
<style>
  :root { --green:#1C4A3A; --cream:#F6EFE0; --cream2:#FBF7EC; --gold:#B98A2F; --gold2:#D8B45F; --ink:#33301F; --muted:#6E6650; --red:#A23B2D; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; }
  body { font-family:system-ui,'Noto Sans CJK SC',sans-serif; color:var(--ink); background:var(--cream); display:flex; flex-direction:column; }
  #app { flex:1; min-height:0; display:flex; flex-direction:column; }   /* 撑满 body：登录态 .login margin:auto 才能垂直居中；主界面 .grid flex:1 独立滚动 + .bar 固定底部（否则商品多时收款栏被推出屏外） */
  header { background:var(--green); color:#F4E7C8; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  header .t { font-weight:700; font-size:16px; }
  header .today { font-size:12px; opacity:.9; text-align:right; }
  header .clock { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  header .clock button { background:#F4E7C8; color:var(--green); border:none; border-radius:12px; padding:7px 10px; font-weight:800; font-size:12px; }
  /* login */
  .login { margin:auto; display:flex; flex-direction:column; gap:12px; width:280px; }
  .login input { padding:14px; font-size:16px; border:1px solid var(--gold2); border-radius:10px; }
  .login button { padding:14px; font-size:16px; font-weight:700; background:var(--green); color:#fff; border:none; border-radius:10px; }
  /* product grid */
  .grid { flex:1; overflow:auto; padding:10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; align-content:start; }
  .cat { grid-column:1/-1; font-weight:700; color:var(--green); font-size:14px; margin:6px 2px 0; }
  .tile { position:relative; background:#fff; border:1px solid var(--gold2); border-radius:14px; padding:10px 8px; min-height:84px;
    display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; transition:transform .05s; }
  .tile:active { transform:scale(.95); }
  .tile.has { border-color:var(--green); background:#EAF1EC; }
  .tile .nm { font-size:13px; font-weight:700; line-height:1.25; }
  .tile .pr { font-size:13px; color:var(--red); font-weight:700; }
  .tile .badge { position:absolute; top:-8px; right:-8px; min-width:26px; height:26px; border-radius:13px; background:var(--green); color:#fff;
    font-weight:700; font-size:14px; display:none; align-items:center; justify-content:center; padding:0 6px; }
  .tile .minus { position:absolute; bottom:-8px; right:-8px; width:28px; height:28px; border-radius:14px; background:var(--red); color:#fff;
    border:none; font-size:18px; line-height:1; display:none; align-items:center; justify-content:center; }
  .tile.has .badge, .tile.has .minus { display:flex; }
  /* bottom bar */
  .bar { background:var(--green); color:#fff; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }   /* 按钮变多后窄屏换行，避免「收款」被挤出屏外 */
  .bar .sum { flex:1; }
  .bar .sum .n { font-size:12px; opacity:.85; }
  .bar .sum .amt { font-size:26px; font-weight:700; line-height:1; }
  .bar .pay { display:flex; gap:6px; }
  .bar .pay button { padding:12px 12px; border-radius:18px; border:1px solid #F4E7C8; background:transparent; color:#F4E7C8; font-size:13px; font-weight:700; }
  .bar .pay button.on { background:#F4E7C8; color:var(--green); }
  .bar .clear { background:transparent; border:1px solid #F4E7C8; color:#F4E7C8; border-radius:12px; padding:10px 12px; font-size:14px; }
  .bar .pay-btn { background:var(--gold2); color:var(--green); border:none; border-radius:14px; padding:14px 20px; font-size:17px; font-weight:700; }
  .bar .pay-btn:disabled { opacity:.4; }
  .toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); background:rgba(28,74,58,.96); color:#fff;
    padding:18px 26px; border-radius:14px; font-size:18px; font-weight:700; display:none; z-index:80; max-width:86vw; text-align:center; white-space:pre-line; }
  .toast.show { display:block; }
  .mask.show ~ .toast { top:14%; }   /* 弹层开着时（退运费成功后列表还在），提示上移，别盖住底下的单子 */
  /* 弹层（充值 / 退运费）：全屏遮罩 + 卡片，触屏大按钮，卡片内滚动 */
  input, textarea { user-select:text; -webkit-user-select:text; }   /* 上面 * 里 user-select:none 会让输入框没法选中改字 */
  .mask { position:fixed; inset:0; background:rgba(28,74,58,.55); display:none; align-items:flex-start; justify-content:center; z-index:60; padding:12px; overflow:auto; }
  .mask.show { display:flex; }
  .sheet { background:var(--cream2); border-radius:18px; width:min(560px,100%); max-height:calc(100vh - 24px); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .sheet h3 { background:var(--green); color:#F4E7C8; padding:13px 14px; font-size:17px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .sheet h3 button { background:transparent; border:1px solid #F4E7C8; color:#F4E7C8; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700; }
  .sheet .body { padding:14px; overflow:auto; display:flex; flex-direction:column; gap:12px; }
  .sheet label { display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .sheet input { width:100%; padding:14px; font-size:18px; border:1px solid var(--gold2); border-radius:12px; background:#fff; color:var(--ink); }
  .btn { padding:14px 16px; border:none; border-radius:12px; font-size:16px; font-weight:800; background:var(--green); color:#fff; }
  .btn.gold { background:var(--gold); color:#fff; }
  .btn.red { background:var(--red); color:#fff; }
  .btn:disabled { opacity:.45; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chips button { flex:1 1 66px; padding:13px 6px; border-radius:12px; border:1px solid var(--gold2); background:#fff; color:var(--ink); font-size:15px; font-weight:700; }
  .chips button.on { background:var(--green); color:#fff; border-color:var(--green); }
  /* 会员核对卡：充值前店员必须肉眼确认「眼前这个人」= 屏幕上这个账号 */
  .who { border:2px dashed var(--gold); border-radius:14px; padding:12px 14px; background:#FCF3DF; }
  .who.ok { border-style:solid; border-color:var(--green); background:#EAF1EC; }
  .who .nm2 { font-size:22px; font-weight:800; color:var(--green); line-height:1.2; }
  .who .ph { font-size:15px; color:var(--muted); margin-top:3px; }
  .who .bal { font-size:14px; margin-top:8px; }
  .who .bal b { font-size:24px; color:var(--red); }
  .who .hint { font-size:13px; font-weight:700; color:var(--gold); margin-top:8px; }
  .err { color:var(--red); font-size:14px; font-weight:700; min-height:18px; white-space:pre-line; }
  .rows { display:flex; flex-direction:column; gap:10px; max-height:50vh; overflow:auto; -webkit-overflow-scrolling:touch; }
  .row { background:#fff; border:1px solid var(--gold2); border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  .row .info { flex:1; min-width:0; }
  .row .info .l1 { font-weight:800; font-size:15px; }
  .row .info .l2 { font-size:12px; color:var(--muted); margin-top:3px; }
  .row .fee { font-size:19px; font-weight:800; color:var(--red); white-space:nowrap; }
  .row button { padding:13px 14px; border-radius:12px; border:none; background:var(--red); color:#fff; font-weight:800; font-size:14px; white-space:nowrap; }
  .row button:disabled { opacity:.45; }
  .empty { padding:18px 6px; text-align:center; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="mask" id="mask"></div>
<div class="toast" id="toast"></div>
<script>
let TOKEN = sessionStorage.getItem('hl_staff') || '';
let CASHIER = sessionStorage.getItem('hl_cashier') || '';
const app = document.getElementById('app');
const cart = {};          // sku -> {p, qty}
let PRODUCTS = [], PAY = 'cash';
let CONFIG = { pricing: { gst_registered: false, gst_rate: 9, service_charge_enabled: false, service_charge_rate: 10 } };
let PROMO = null, BALPHONE = null;   // PROMO={code,discount} 当前优惠券；BALPHONE=余额收款锁定的会员手机号
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');   // 商品名转义（未来商品名可编辑后防 stored XSS）
let _saleTok = null;           // POS 收款幂等令牌：一次收款一个，失败重试用同令牌，成功后换新（后端按 client_token 去重，防双击/重试双记）
let MENU_REVISION = null;      // 当前这批菜单属于哪个发布
let _acceptedRevision = null;  // 店员显式确认过的新发布版本
let _tenderSeq = 0;            // 收款状态轮次：增减商品、清空、切换收款方式、应用优惠券、菜单变更、成交都会 +1；
                               // 在途的优惠券预览、会员余额查询回来时轮次变了就作废，不能把旧金额写回来
let _acceptedSkus = new Set(); // 确认时核对过的商品：只有这单全是这些商品，才按新版本成交；其余一律按屏幕上菜单的版本提交
let CATS = {};   // {key: 中文名}，随 /api/menu 的已发布分类一起更新

function login() {
  app.innerHTML = `<header><span class="t">收银台 POS</span></header>
    <form class="login" onsubmit="doLogin();return false" autocomplete="on">
      <select id="cashier" name="username" autocomplete="username" style="padding:14px;font-size:16px;border:1px solid var(--gold2);border-radius:10px">
        <option value="pos1">收银员 1 (pos1)</option><option value="pos2">收银员 2 (pos2)</option><option value="pos3">收银员 3 (pos3)</option>
      </select>
      <input id="pin" name="password" type="password" autocomplete="current-password" placeholder="PIN 密码" inputmode="numeric">
      <button type="submit">登录收银台</button>
      <div id="lerr" style="color:var(--red);font-size:13px;text-align:center"></div></form>`;
}
window.doLogin = async () => {
  const cashier = document.getElementById('cashier').value, pin = document.getElementById('pin').value.trim();
  try {
    const r = await fetch('/api/pos/login', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ cashier, pin }) });
    const d = await r.json();
    if (!d.ok) { document.getElementById('lerr').textContent = d.error || '登录失败'; return; }
    TOKEN = d.token; CASHIER = d.cashier;
    sessionStorage.setItem('hl_staff', TOKEN); sessionStorage.setItem('hl_cashier', CASHIER);
    start();
  } catch (e) { document.getElementById('lerr').textContent = '网络错误'; }
};

function setCategories(list) {
  CATS = {};
  for (const c of (list || [])) if (c && c.key) CATS[c.key] = c.cn || c.en || c.key;
  for (const p of PRODUCTS) if (p.category && !(p.category in CATS)) CATS[p.category] = p.category;
}
async function start() {
  try { const c = await (await fetch('/api/config')).json(); if (c && c.pricing) CONFIG = c; } catch (e) {}
  try {
    const r = await fetch('/api/menu'); const d = await r.json();
    PRODUCTS = d.products || [];
    MENU_REVISION = d.menu_revision || null;   // 这批价格属于哪个发布：收款时带上，服务端据此判断是否已变
    setCategories(d.categories);
  } catch (e) { PRODUCTS = []; MENU_REVISION = null; setCategories([]); }
  render();   // render() 内部会拉今日营业额 + 打卡状态
}
// 菜单在开单期间被换了：整份菜单重新载入，屏幕上每个商品都按下一单实际成交的版本显示。
// 当前这单里已下架的商品保留并标记不可售，等店员处理；载入失败就保持旧版本，下一单服务端仍会再拦一次。
async function reloadMenuAfterChange() {
  try {
    const d = await (await fetch('/api/menu', { cache: 'no-store' })).json();
    if (!Array.isArray(d.products) || !d.menu_revision) return false;
    const fresh = new Map(d.products.map(p => [p.sku, p]));
    const kept = PRODUCTS.filter(p => cart[p.sku] && !fresh.has(p.sku)).map(p => ({ ...p, unavailable: true }));
    PRODUCTS = [...d.products, ...kept];
    for (const sku in cart) cart[sku].p = PRODUCTS.find(p => p.sku === sku) || { ...cart[sku].p, unavailable: true };
    MENU_REVISION = d.menu_revision;
    setCategories(d.categories);
    return true;
  } catch (e) { return false; }
}

function render() {
  let tiles = '';
  for (const k of Object.keys(CATS)) {
    const items = PRODUCTS.filter(p => p.category === k);
    if (!items.length) continue;
    tiles += `<div class="cat">${esc(CATS[k])}</div>`;
    for (const p of items) {
      const q = cart[p.sku]?.qty || 0;
      tiles += `<div class="tile ${q ? 'has' : ''}" id="t-${p.sku}" onclick="add('${p.sku}')">
        <div class="nm">${esc(p.name_cn)}</div><div class="pr">S$ ${p.price.toFixed(2)}</div>
        <div class="badge" id="b-${p.sku}">${q}</div>
        <button class="minus" onclick="event.stopPropagation();sub('${p.sku}')">−</button></div>`;
    }
  }
  app.innerHTML = `<header><span class="t">收银台 · ${CASHIER}</span><span class="clock"><span class="today" id="today">今日 —</span><span class="today" id="clockState">打卡 —</span><button onclick="clock('in')">上班</button><button onclick="clock('out')">下班</button><button onclick="logout()">退出</button></span></header>
    <div class="grid">${tiles || '<p style="padding:20px">无在售商品</p>'}</div>
    <div class="bar">
      <div class="sum"><div class="n"><span id="cnt">0</span> 件<span id="promo-tag" style="color:#F4E7C8;font-weight:700;opacity:1"></span></div><div class="amt">S$ <span id="amt">0.00</span></div></div>
      <button class="clear" onclick="clearCart()">清空</button>
      <button class="clear" onclick="openTopup()">💰 充值</button>
      <button class="clear" onclick="openRefund()">💸 退运费</button>
      <button class="clear" id="coupon-btn" onclick="applyCoupon()">优惠券</button>
      <div class="pay">
        <button id="pay-cash" class="${PAY === 'cash' ? 'on' : ''}" onclick="setPay('cash')">现金</button>
        <button id="pay-paynow" class="${PAY === 'paynow' ? 'on' : ''}" onclick="setPay('paynow')">PayNow</button>
        <button id="pay-balance" class="${PAY === 'balance' ? 'on' : ''}" onclick="payBalance()">余额</button>
      </div>
      <button class="pay-btn" id="checkout" disabled onclick="checkout()">收款</button>
    </div>`;
  updateBar();
  refreshToday();        // render() 会把 #today 重置成占位「今日 —」，不在这里重拉，按了「清空」之后店员就再也看不到今日营业额
  refreshAttendance();
}
function tileState(sku) {
  const q = cart[sku]?.qty || 0;
  const t = document.getElementById('t-' + sku), b = document.getElementById('b-' + sku);
  if (t) t.classList.toggle('has', q > 0);
  if (b) b.textContent = q;
}
function resetTender() { if (PROMO || BALPHONE) { PROMO = null; BALPHONE = null; if (PAY === 'balance') setPay('cash'); } }   // 购物车一变，已应用的券/余额锁定即失效（折后金额/余额够不够会变，避免陈旧判断）
window.add = (sku) => {
  ++_tenderSeq;
  const p = PRODUCTS.find(x => x.sku === sku);
  cart[sku] = { p, qty: (cart[sku]?.qty || 0) + 1 };
  resetTender(); tileState(sku); updateBar();
};
window.sub = (sku) => {
  if (!cart[sku]) return;
  ++_tenderSeq;
  cart[sku].qty--; if (cart[sku].qty <= 0) delete cart[sku];
  resetTender(); tileState(sku); updateBar();
};
window.setPay = (m) => {
  ++_tenderSeq;
  PAY = m;
  if (m !== 'balance') BALPHONE = null;   // 切到现金/PayNow → 解除余额锁定
  document.getElementById('pay-cash').classList.toggle('on', m === 'cash');
  document.getElementById('pay-paynow').classList.toggle('on', m === 'paynow');
  const pb = document.getElementById('pay-balance'); if (pb) pb.classList.toggle('on', m === 'balance');
};
window.clearCart = () => { ++_tenderSeq; for (const k in cart) delete cart[k]; PROMO = null; BALPHONE = null; PAY = 'cash'; render(); };   // 收款方式一并回到默认现金：render() 的高亮由 PAY 推导，不回位就会出现「屏幕亮现金、实际记 PayNow」
window.logout = () => {
  if (totals().n > 0 && !confirm('购物车里还有没收款的商品，确定退出登录？')) return;
  for (const k in cart) delete cart[k];
  PROMO = null; BALPHONE = null; PAY = 'cash'; _saleTok = null;
  TOKEN = ''; CASHIER = '';
  sessionStorage.removeItem('hl_staff'); sessionStorage.removeItem('hl_cashier');
  closeModal(); login();
};
window.applyCoupon = async () => {
  const { s } = totals();
  if (!(s > 0)) { toast('请先加商品'); return; }
  if (PROMO) { PROMO = null; if (PAY === 'balance') setPay('cash'); updateBar(); toast('已取消优惠券'); return; }   // 再点一次=取消
  const code = (prompt('优惠码 Promo code:') || '').trim().toUpperCase();
  if (!code) return;
  const seq = _tenderSeq;
  const r = await fetch('/api/promo/check', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code, subtotal: s, fulfilment: 'walkin' }) });
  const d = await r.json();
  // 预览期间菜单重新载入或购物车变了：这个折扣是按旧小计算的，不能写回
  if (seq !== _tenderSeq || totals().s !== s) { toast('购物车、菜单或收款方式已变化，请重新应用优惠券'); return; }
  if (d.error || !(d.discount > 0)) { toast('券无效：' + (d.error || '无折扣')); return; }
  PROMO = { code, discount: +d.discount.toFixed(2) };
  ++_tenderSeq;   // 应付变了：在途的余额查询作废
  if (PAY === 'balance') setPay('cash');   // 折后金额变了，原余额锁定作废，需重选余额
  updateBar();
  toast(`✓ 优惠券 −S$${PROMO.discount.toFixed(2)}`);
};
window.payBalance = async () => {
  const { s } = totals();
  if (!(s > 0)) { toast('请先加商品'); return; }
  const phone = (prompt('会员手机号 Member phone（余额收款）:') || '').trim();
  if (!phone) return;
  const seq = _tenderSeq;
  const r = await fetch('/api/pos/member?phone=' + encodeURIComponent(phone), { headers: { authorization: 'Bearer ' + TOKEN } });
  if (r.status === 401) { sessionStorage.removeItem('hl_staff'); return login(); }
  const d = await r.json();
  // 查询期间购物车、菜单或收款方式变了：这个结果按旧应付核对的，不能恢复余额锁定
  if (seq !== _tenderSeq || totals().s !== s) { toast('购物车、菜单或收款方式已变化，请重新查会员'); return; }
  if (!d.found) { toast('查无此会员，请先充值'); return; }
  const net = chargePreview(s, PROMO ? PROMO.discount : 0).total;
  if (d.balance < net) { toast(`余额不足：S$${d.balance.toFixed(2)} < 应付 S$${net.toFixed(2)}`); return; }
  BALPHONE = d.phone;
  setPay('balance');
  toast(`${d.name || '（该会员未填姓名）'} ${d.phone}\n余额 S$${d.balance.toFixed(2)}，本单扣 S$${net.toFixed(2)}\n请当面核对是不是这位顾客`, 3000);   // 扣的是别人的储值，得把「扣谁的」写在屏幕上让店员核对，不能只报个数字
};
/* ===================== 弹层基础（充值 / 退运费共用） ===================== */
function closeModal() { const m = document.getElementById('mask'); if (!m) return; m.classList.remove('show'); m.innerHTML = ''; }
function modalAuthFail() { closeModal(); sessionStorage.removeItem('hl_staff'); login(); }   // token 过期：先收弹层再回登录页，别把弹层留在登录界面上
function setErr(id, msg) { const e = document.getElementById(id); if (e) e.textContent = msg || ''; }
function normSgPhone(raw) { const d = String(raw == null ? '' : raw).replace(/\D/g, ''); return (d.length === 10 && d.startsWith('65')) ? d.slice(2) : d; }   // 与后端 normPhone 同口径：+65 前缀归一成 8 位
function validSgPhone(d) { return /^[89]\d{7}$/.test(d); }   // 与后端 sgCounterPhone 同口径，本地先挡一次少一次白跑
function sgtStamp(x) {
  if (!x) return '—';
  const t = new Date(x); if (isNaN(t.getTime())) return String(x);
  const s = new Date(t.getTime() + 480 * 60000).toISOString();   // UTC → SGT(+8)
  return s.slice(5, 10) + ' ' + s.slice(11, 16);
}

window.doRefund = async (i) => {
  const o = RLIST[i]; if (!o) return;

function totals() { let s = 0, n = 0; for (const k in cart) { s += cart[k].p.price * cart[k].qty; n += cart[k].qty; } return { s, n }; }
function money(v) { return Math.round((+v || 0) * 100) / 100; }
function chargePreview(sub, disc) {
  const p = CONFIG.pricing || {};
  const goods = Math.max(0, money(sub) - money(disc));
  const svc = p.service_charge_enabled ? money(goods * (+p.service_charge_rate || 0) / 100) : 0;
  const taxable = money(goods + svc);
  const gst = p.gst_registered ? money(taxable * (+p.gst_rate || 0) / 100) : 0;
  return { service_charge: svc, gst, total: money(taxable + gst) };
}
function updateBar() {
  const { s, n } = totals();

  document.getElementById('cnt').textContent = n;
  const tag = document.getElementById('promo-tag');
  if (tag) tag.textContent = [
    disc > 0 ? `券−$${disc.toFixed(2)}` : '',
    ch.service_charge > 0 ? `服务费$${ch.service_charge.toFixed(2)}` : '',
    ch.gst > 0 ? `GST$${ch.gst.toFixed(2)}` : '',
  ].filter(Boolean).map(x => ' · ' + x).join('');
  document.getElementById('checkout').disabled = n === 0;
}

  const body = { items, pay_method: PAY, cashier: CASHIER, client_token: _saleTok,
    menu_revision: (_acceptedRevision && items.every(i => _acceptedSkus.has(i.sku))) ? _acceptedRevision : MENU_REVISION };

  if (PAY === 'balance') body.phone = BALPHONE;
  try {
    const r = await fetch('/api/pos/sale', {
      method: 'POST', headers: { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' },

    if (r.status === 401) { sessionStorage.removeItem('hl_staff'); return login(); }
    const d = await r.json();
    // 菜单在开单期间被换了：不自动按新价成交，把差异摆给店员，要再点一次「收款」。
    if (r.status === 409 && d.code === 'menu_changed') {
      for (const line of (d.lines || [])) {
        const item = PRODUCTS.find(p => p.sku === line.sku);
        if (item && line.available && line.unit_price_cents != null) { item.price = line.unit_price_cents / 100; item.price_cents = line.unit_price_cents; }
        if (item && !line.available) item.unavailable = true;
      }
      _acceptedRevision = d.active_revision;
      _acceptedSkus = new Set((d.lines || []).map(line => line.sku));
      // 价格变了，按旧小计算的优惠券折扣和余额锁定都作废：屏幕应收必须等于服务端将要记的金额
      const hadTender = !!(PROMO || BALPHONE);
      resetTender(); ++_tenderSeq;
      // 重新载入成功：屏幕整份换成新菜单，MENU_REVISION 随之更新；失败：保持旧版本，别的商品下一单会再被拦一次
      await reloadMenuAfterChange();

      const detail = (d.changes || []).map(c => {
        const name = ((d.lines || []).find(l => l.sku === c.sku) || {}).name_cn || c.sku;
        if (c.reason === 'contents') return `${name}：组成改为 ${c.new_contents_cn || '（无）'}`;

          : `${name}：S$${((c.old_price_cents || 0) / 100).toFixed(2)} → S$${(c.new_price_cents / 100).toFixed(2)}`;
      }).join('；');
      toast('菜单已更新：' + detail + (hadTender ? ' —— 优惠券/余额已取消，请重新应用后再点收款' : ' —— 请确认新价格后再点收款'), hadTender ? 4000 : undefined);
      btn.disabled = false;
      return;
    }
    if (d.ok) { ++_tenderSeq; _saleTok = null; _acceptedRevision = null; _acceptedSkus = new Set(); PROMO = null; BALPHONE = null; PAY = 'cash'; toast('✓ 收款 S$ ' + d.total.toFixed(2) + (d.pay_method === 'balance' ? ' · 余额' : '')); for (const k in cart) delete cart[k]; render(); }   // 收完一单收款方式回默认现金；下一单要 PayNow 得再点一次，屏幕高亮与 PAY 始终一致
    else { toast('失败：' + (d.error || '')); btn.disabled = false; }
  } catch (e) { toast('网络错误'); btn.disabled = false; }
};
async function refreshToday() {
  try {
    const r = await fetch('/api/pos/today?cashier=' + encodeURIComponent(CASHIER), { headers: { authorization: 'Bearer ' + TOKEN } });
    if (r.status === 401) { sessionStorage.removeItem('hl_staff'); return login(); }   // 签名 token 过期 → 回登录页重输 PIN
    const d = await r.json();
    const el = document.getElementById('today');
    if (el) el.textContent = `我今日 ${d.orders} 单 · S$ ${(d.revenue || 0).toFixed(2)}`;
  } catch (e) {}
}
async function refreshAttendance() {
  try {
    const r = await fetch('/api/pos/attendance/today', { headers: { authorization: 'Bearer ' + TOKEN } });
    if (r.status === 401) { sessionStorage.removeItem('hl_staff'); return login(); }
    const d = await r.json();
    const ins = (d.records || []).find(x => x.kind === 'in');
    const outs = (d.records || []).find(x => x.kind === 'out');
    const fmt = x => x ? new Date(new Date(x).getTime() + 480 * 60000).toISOString().slice(11,16) : '—';
    const el = document.getElementById('clockState');
    if (el) el.textContent = `上 ${fmt(ins && ins.punched_at)} / 下 ${fmt(outs && outs.punched_at)}`;
  } catch (e) {}
}
window.clock = async (kind) => {
  const r = await fetch('/api/pos/attendance', { method:'POST', headers:{authorization:'Bearer '+TOKEN,'content-type':'application/json'}, body: JSON.stringify({ kind }) });
  if (r.status === 401) { sessionStorage.removeItem('hl_staff'); return login(); }
  const d = await r.json();
  if (d.ok) { toast((kind === 'out' ? '下班' : '上班') + '打卡成功'); refreshAttendance(); }
  else toast('打卡失败：' + (d.error || ''));
};

(TOKEN && CASHIER) ? start() : login();
</script>
