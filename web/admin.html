<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店主后台 Admin</title>
<link rel="icon" href="/img/logo.svg">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<script src="/vendor/leaflet/leaflet.js"></script>
<style>
  :root { --green:#1C4A3A; --cream:#F6EFE0; --gold2:#D8B45F; --ink:#33301F; --muted:#6E6650; --red:#A23B2D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,'Noto Sans CJK SC',sans-serif; color:var(--ink); background:var(--cream); padding:16px; }
  h1 { color:var(--green); font-size:20px; margin-bottom:12px; }
  .login { max-width:320px; margin:60px auto; display:flex; flex-direction:column; gap:10px; }
  input, button, select, textarea { padding:10px; border-radius:8px; border:1px solid var(--gold2); font-size:15px; }
  .field input, .field select, .field textarea { width:100%; }   /* .field 内输入框撑满容器，杜绝长URL/邮区被右边缘截断 */
  textarea { resize:vertical; font-family:inherit; line-height:1.45; }
  @media (max-width:680px){ .offgrid{ grid-template-columns:1fr !important; } }   /* 线下录入窄屏单列 */
  /* grid 轨道默认 min-width:auto = 内容最小宽，里面有个定宽的小票预览就会把整页顶出横向滚动条；
     min-width:0 让轨道可以收窄，超宽内容由自己的 overflow:auto 承担 */
  .offgrid > * { min-width:0; }
  button { background:var(--green); color:#fff; border:none; font-weight:700; cursor:pointer; }
  .cards { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .stat { background:#fff; border:1px solid var(--gold2); border-radius:10px; padding:12px 16px; flex:1; min-width:120px; }
  .stat .k { font-size:11px; color:var(--muted); white-space:nowrap; } .stat .v { font-size:22px; font-weight:700; color:var(--green); }
  .filters { margin-bottom:10px; display:flex; gap:8px; align-items:center; }
  table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
  th { background:var(--green); color:#F4E7C8; padding:8px; text-align:left; position:sticky; top:0; }
  td { padding:8px; border-bottom:1px solid #eee; vertical-align:top; }
  /* 手机端：让带 overflow-x wrapper 的表真正横向滚动而非缩列换行（min-width 让内容超出 wrapper 才触发滚动）+ 首列单号/手机号不断行。属性选择器一次匹配全部 6 个内联 wrapper */
  [style*="overflow-x:auto"] table { min-width:640px; }
  /* 订单表有 9 列（商品/履约方式还带地址），640 撑不住：笔电 900-1000px 时列被压成竖排单字，
     一行订单能拉到 200px 高。给它单独一个更大的下限，窄了就横向滚动而不是把字挤成一条 */
  [style*="overflow-x:auto"] table.ordtbl { min-width:980px; }
  [style*="overflow-x:auto"] td:first-child, [style*="overflow-x:auto"] td:first-child a { white-space:nowrap; }
  /* 第 2 列都是短字段(时间/类型/顾客/手机号)，手机上 2026-08-09 会被拆成 3 行，读不出是哪天 */
  [style*="overflow-x:auto"] td:nth-child(2) { white-space:nowrap; }
  .member-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; position:relative; }
  .member-table { min-width:1320px; }
  .member-table th:last-child, .member-table td:last-child {
    position:sticky; right:0; min-width:132px; z-index:2; background:#fff;
    box-shadow:-8px 0 12px rgba(28,74,58,.12);
  }
  .member-table th:last-child { z-index:3; background:var(--green); }
  .badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; white-space:nowrap; }   /* nowrap：窄列里「制作中」被逐字拆成三行，看不出是个状态标 */
  .UNPAID { background:#F6E4C4; color:var(--red); } .PAID { background:#DDEBDD; color:var(--green); }
  /* CANCELLED/REFUNDED 原来没配色 → 渲染成没有底色的裸文字，和其它状态不是一个东西，退款单反而最不显眼 */
  .CANCELLED { background:#EFE9D8; color:var(--muted); } .REFUNDED { background:#F6D9D2; color:var(--red); }
  .mp { background:var(--red); color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:12px; cursor:pointer; }
  a { color:var(--green); }
  .nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .navbtn { display:inline-block; background:var(--green); color:#fff; border:none; border-radius:10px; padding:12px 14px; font-size:14px; font-weight:700; text-decoration:none; cursor:pointer; }
	  .chartbox { background:#fff; border:1px solid var(--gold2); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
	  .chart-h { font-weight:700; color:var(--green); margin-bottom:10px; font-size:15px; }
	  .cmdarea { width:100%; min-height:120px; resize:vertical; border:1px solid var(--gold2); border-radius:8px; background:#2B2B26; color:#F6EFE0; padding:10px; font-family:'SF Mono','Menlo',monospace; font-size:11px; line-height:1.45; }
	  .cmdrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
	  .cmdrow button { font-size:12px; padding:8px 10px; }
	  .barrow { display:grid; grid-template-columns:120px 1fr 42px; align-items:center; gap:10px; margin:5px 0; }
  .barname { font-size:13px; font-weight:700; }
  .bartrack { background:#F0EAD8; border-radius:8px; height:22px; overflow:hidden; }
  .bar { height:100%; background:linear-gradient(90deg,#2A5C49,#1C4A3A); border-radius:8px; min-width:3px; }
  .barval { font-weight:700; color:var(--green); text-align:right; }
  @media print {
    .noprint { display:none !important; }
    body { padding:0; background:#fff; }
    .nav, .cards { display:none !important; }
    .chartbox { border:none; }
  }
  /* 宽屏居中：5 个表单类视图(settings/payment/courier/zones/print)的内容包在 max-width div 里，
     原缺 margin:0 auto → 桌面左钉留白。仅命中 #app 直接子级带内联 max-width 的 div，不碰满宽看板/表格视图。 */
  #app > div[style*="max-width"] { margin: 0 auto; }
  .pickup-photo-box { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .pickup-photo-box img { width:min(100%,220px); aspect-ratio:3/4; object-fit:cover; border-radius:10px; border:1px solid var(--gold2); background:#fff; }
  .pickup-photo-tools { flex:1; min-width:240px; display:flex; flex-direction:column; gap:8px; }
  .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:0 0 14px; }
  .quick-card { display:block; border:1px solid var(--gold2); border-radius:12px; padding:13px 14px; background:#fff; color:var(--ink); text-decoration:none; cursor:pointer; }
  .quick-card b { display:block; color:var(--green); font-size:15px; margin-bottom:3px; }
  .quick-card span { color:var(--muted); font-size:12px; line-height:1.45; }
  .pickup-extra { border:1px solid var(--gold2); border-radius:12px; padding:12px; margin-top:10px; background:#fffdf7; }
  .pickup-extra-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pickup-extra-grid .wide { grid-column:1/-1; }
  .poster-admin-row { background:#fff; border:1px solid var(--gold2); border-radius:14px; padding:14px; margin-bottom:12px; }
  .poster-admin-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .poster-admin-head .poster-order { display:flex; gap:6px; margin-left:auto; }
  .poster-admin-fields { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .poster-admin-fields .wide { grid-column:1/-1; }
  .poster-preview { width:min(100%,230px); aspect-ratio:4/5; object-fit:cover; border:1px solid var(--gold2); border-radius:12px; background:linear-gradient(145deg,#1C4A3A,#12372c); }
  .poster-preview-tools { flex:1; min-width:240px; }
  .poster-checks { display:flex; gap:16px; flex-wrap:wrap; padding:8px 0; }
  .poster-checks label { display:flex; align-items:center; gap:6px; font-size:13px; }
  .poster-checks input { width:20px; height:20px; }
  .poster-savebar { position:sticky; bottom:8px; z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px; background:rgba(246,239,224,.96); border:1px solid var(--gold2); border-radius:12px; }
  .publication-diff { table-layout:fixed; margin-top:12px; }
  .publication-diff th:first-child { width:26%; }
  .publication-diff td { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.55; }
  .publication-diff td:last-child { background:#F0F7EF; }
  .publication-diff small { display:block; color:var(--muted); font-size:11px; }
  .publication-diff dl { margin:0; }
  .publication-diff dt { color:var(--muted); margin-top:8px; }
  .publication-diff dt:first-child { margin-top:0; }
  .publication-diff dd { margin:0; }
  .publication-diff details { margin-top:6px; }
  @media (max-width:680px){
    .publication-diff, .publication-diff tbody, .publication-diff tr, .publication-diff td { display:block; width:100%; min-width:0; }
    .publication-diff thead { display:none; }
    .publication-diff tr { border:1px solid #D8B45F; border-radius:8px; overflow:hidden; margin-bottom:12px; }
    .publication-diff td:first-child { background:#F6EFE0; font-weight:700; }
    .publication-diff td[data-label]::before { content:attr(data-label); display:block; font-weight:700; color:var(--green); margin-bottom:4px; }
  }
  @media (max-width:680px){
    body { padding:10px; }
    .navbtn { padding:10px 12px; }
    .pickup-photo-box img { width:100%; max-height:360px; }
    .pickup-photo-tools { min-width:100%; }
    .pickup-extra-grid, .poster-admin-fields { grid-template-columns:1fr; }
    .pickup-extra-grid .wide, .poster-admin-fields .wide { grid-column:auto; }
    .poster-preview { width:100%; max-height:420px; }
    .poster-preview-tools { min-width:100%; }
  }
  /* 账簿表：数字右对齐、等宽数字、合计上划线 —— 与试算平衡表同一套版式 */
  table.ledger { width:100%; border-collapse:collapse; font-size:13px; }
  table.ledger th, table.ledger td { padding:6px 10px; border-bottom:1px solid #E4D9BE; text-align:left; }
  table.ledger th.num, table.ledger td.num { text-align:right; font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum"; white-space:nowrap; }
  table.ledger tfoot .total th, table.ledger tfoot .total td { border-top:2px solid var(--green); font-weight:700; }
  table.ledger tfoot .diff td.num { font-weight:700; }
  table.ledger tfoot .diff.ok td.num { color:#246048; }
  table.ledger tfoot .diff.off td.num { color:#A23B2D; }
</style>
</head>
<body>
<div id="app"></div>
<script>
let TOKEN = sessionStorage.getItem('hl_admin') || '';
let _offItemsTok = null, _offLumpTok = null;
let PICKUP_PHOTO = null, PICKUP_PHOTO_ORIG = '';
let STORE_SETTINGS_REVISION = '';
let STORE_DRAFT_REVISION = '';
const DRAFT_CONFLICT_MESSAGE = '内容已在别处改动，你的输入已保留。请先记录输入，再重新加载并重新核对；再次点击保存不会覆盖别人的修改。';
let PICKUP_POINT_PHOTOS = {};
let PICKUP_PHOTO_JOBS = new Map();
let PICKUP_SETTINGS_SAVING = false;
let PICKUP_SETTINGS_DISABLED = [];
let MEMBER_SEARCH_TIMER = null;
let TOPUP_MEMBER_SEARCH_TIMER = null;
let TOPUP_MEMBER_SEARCH_REQUEST = 0;
let TOPUP_MEMBER_RESULTS = [];
let TOPUP_SELECTED_MEMBER = null;
let TOPUP_AUDIT_FILTERS = { q:'', method:'', since:'', until:'', offset:0, label:'' };
let TOPUP_AUDIT_FROM_MEMBER = false;
const PICKUP_PHOTO_MAX_DATA_URL_CHARS = 850000;
function pickupPhotoErrorMessage(err) { return String(err && err.message ? err.message : err || '图片处理失败，请换一张 JPG、PNG 或 WebP 重试'); }
function compressPickupPhoto(file) {
  if (!file) return Promise.reject(new Error('没有选择照片'));
  if (+file.size > 20 * 1024 * 1024) return Promise.reject(new Error('原图超过 20MB，请先缩小后重试'));
  return new Promise((resolve, reject) => {
    const img = new Image(); let objectUrl = '';
    const timer = setTimeout(() => { if (objectUrl) URL.revokeObjectURL(objectUrl); reject(new Error('照片处理超时')); }, 20000);
    img.onerror = () => { clearTimeout(timer); if (objectUrl) URL.revokeObjectURL(objectUrl); reject(new Error('无法识别这张照片，请改用 JPG、PNG 或 WebP')); };
    img.onload = () => {
      try {
        let scale = Math.min(1, 900 / Math.max(img.width, img.height)), quality = .80;
        let width = Math.max(1, Math.round(img.width * scale)), height = Math.max(1, Math.round(img.height * scale));
        for (let i = 0; i < 16; i++) {
          const cv = document.createElement('canvas'); cv.width = width; cv.height = height;
          const ctx = cv.getContext('2d'); if (!ctx) throw new Error('浏览器无法处理图片'); ctx.drawImage(img, 0, 0, width, height);
          const data = cv.toDataURL('image/jpeg', quality);
          if (data.length <= PICKUP_PHOTO_MAX_DATA_URL_CHARS) { clearTimeout(timer); URL.revokeObjectURL(objectUrl); resolve(data); return; }
          if (quality > .50) quality -= .08; else { width = Math.max(1, Math.round(width * .85)); height = Math.max(1, Math.round(height * .85)); quality = .72; }
        }
        throw new Error('照片压缩后仍过大，请裁剪后重试');
      } catch (e) { clearTimeout(timer); if (objectUrl) URL.revokeObjectURL(objectUrl); reject(e); }
    };
    try { objectUrl = URL.createObjectURL(file); img.src = objectUrl; } catch (e) { clearTimeout(timer); reject(new Error('照片读取失败')); }
  });
}
function startPickupPhotoJob(key, file, onReady, statusEl) {
  const job = { state:'processing', error:'', promise:null }; PICKUP_PHOTO_JOBS.set(key, job);
  if (statusEl) { statusEl.textContent = '⏳ 正在处理照片…'; statusEl.style.color = 'var(--muted)'; }
  job.promise = compressPickupPhoto(file).then(data => {
    if (PICKUP_PHOTO_JOBS.get(key) !== job) return;
    onReady(data); job.state = 'ready'; if (statusEl) { statusEl.textContent = `✅ 待保存 · ${Math.ceil(data.length / 1024)} KB`; statusEl.style.color = 'var(--green)'; }
  }).catch(e => { if (PICKUP_PHOTO_JOBS.get(key) !== job) return; job.state = 'failed'; job.error = pickupPhotoErrorMessage(e); if (statusEl) { statusEl.textContent = '❌ ' + job.error; statusEl.style.color = 'var(--red)'; } });
  return job.promise;
}
async function waitForPickupPhotoJobs() {
  // A compression callback can enqueue/replace another job. Keep taking snapshots
  // until the map is stable so saving never races a just-selected replacement image.
  while (true) {
    const processing = Array.from(PICKUP_PHOTO_JOBS.values()).filter(j => j.state === 'processing');
    if (!processing.length) break;
    await Promise.all(processing.map(j => j.promise));
  }
  return Array.from(PICKUP_PHOTO_JOBS.values()).filter(j => j.state === 'failed');
}
function lockPickupSettings() {
  PICKUP_SETTINGS_SAVING = true;
  PICKUP_SETTINGS_DISABLED = Array.from(app.querySelectorAll('input,textarea,select,button')).map(el => [el, el.disabled]);
  PICKUP_SETTINGS_DISABLED.forEach(([el]) => { el.disabled = true; });
}
function unlockPickupSettings() {
  PICKUP_SETTINGS_SAVING = false;
  PICKUP_SETTINGS_DISABLED.forEach(([el, disabled]) => { if (el.isConnected) el.disabled = disabled; });
  PICKUP_SETTINGS_DISABLED = [];
}
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
// created_at 等时间戳存的是 UTC ISO；展示时 +8h 转 SGT，与单号营业日(ORD-YYYYMMDD)口径一致，避免 SGT 0-8 点差一天。
const sgt = (iso, len = 16) => iso ? new Date(new Date(iso).getTime() + 480 * 60000).toISOString().slice(0, len).replace('T', ' ') : '';
const app = document.getElementById('app');

function loginView() {
  app.innerHTML = `<form class="login" onsubmit="doLogin();return false" autocomplete="on"><h1>老板后台登录</h1>
    <input type="text" name="username" autocomplete="username" value="boss-admin" readonly aria-hidden="true" tabindex="-1" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <input id="tk" name="password" type="password" autocomplete="current-password" placeholder="管理密码 ADMIN_TOKEN">
    <button type="submit">登录</button>
    <p style="color:var(--muted);font-size:12px">密码 = Worker secret <code>ADMIN_TOKEN</code>　·　账号 <code>boss-admin</code></p></form>`;
}
window.doLogin = () => { TOKEN = document.getElementById('tk').value.trim(); sessionStorage.setItem('hl_admin', TOKEN); dash(); };

// ── 商品标签 + 内容发布 ─────────────────────────────────────────────────────
// 全部走「乐观并发」：页面上拿到的 draft_revision 一起提交，服务端不匹配就 409，
// 前端只提示、不丢用户填的内容。任何草稿改动都【不会】自己上线，必须显式发布。
let TAGS = [], TAG_DRAFT_REVISION = '', TAG_PRODUCTS = [], TAG_ASSIGNMENTS = {};

const TAG_TONES = [['green','绿'],['gold','金'],['red','红'],['blue','蓝'],['neutral','灰']];

async function apiSend(path, method, body) {
  const r = await fetch(path, { method, headers: { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { sessionStorage.removeItem('hl_admin'); loginView(); throw new Error('unauthorized'); }
  let parsed = null; try { parsed = await r.json(); } catch (e) {}
  return { status: r.status, body: parsed || {} };
}

async function tagsView() {
  const app = document.getElementById('app');
  app.innerHTML = '<p>加载中…</p>';
  try {
    const tags = await api('/api/admin/tags');
    TAGS = tags.tags || []; TAG_DRAFT_REVISION = tags.draft_revision || '';
    TAG_PRODUCTS = tags.products || [];
    TAG_ASSIGNMENTS = {};
    for (const row of tags.assignments || []) (TAG_ASSIGNMENTS[row.sku] ||= []).push(row.tag_id);
    renderTagsView('');
  } catch (e) { if (e.message !== 'unauthorized') app.innerHTML = '<p>加载失败：' + esc(e.message) + '</p>'; }
}

function renderTagsView(message) {
  const rows = TAGS.map(tag => `<tr data-tag-id="${esc(tag.id)}">
    <td><code>${esc(tag.id)}</code></td>
    <td>${esc(tag.label_cn)}</td><td>${esc(tag.label_en || '')}</td>
    <td><span class="tag-swatch tone-${esc(tag.tone)}">${esc(tag.icon || '')} ${esc(tag.tone)}</span></td>
    <td>${tag.active ? '启用' : '停用'}</td><td>${esc(String(tag.sort))}</td>
    <td><button type="button" data-toggle-tag="${esc(tag.id)}" onclick="toggleTag('${esc(tag.id)}')">${tag.active ? '停用' : '启用'}</button>
        <button type="button" data-delete-tag="${esc(tag.id)}" onclick="deleteTag('${esc(tag.id)}')">删除</button></td></tr>`).join('');
  const productOptions = TAG_PRODUCTS.map(p => `<option value="${esc(p.sku)}">${esc(p.sku)} · ${esc(p.name_cn)}</option>`).join('');
  document.getElementById('app').innerHTML = `<h1>🏷️ 商品标签 <button onclick="dash()" style="font-size:13px;padding:6px 12px">← 返回</button></h1>
  <div class="chartbox" style="font-size:13px;line-height:1.65;color:var(--muted)">
    标签只是【展示】用的说明，改了不会自己上线 —— 要顾客看到，去「内容发布」里发布一次。
    草稿版本 <code data-draft-revision>${esc(TAG_DRAFT_REVISION)}</code></div>
  <table data-tag-list style="width:100%;margin-top:12px"><thead><tr>
    <th>ID</th><th>中文</th><th>英文</th><th>颜色</th><th>状态</th><th>排序</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7">还没有标签。</td></tr>'}</tbody></table>
  <div class="chartbox" style="margin-top:12px">
    <b>新增 / 修改标签</b>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px">
      <input data-tag-input-id placeholder="ID（小写英文/数字/连字符）">
      <input data-tag-input-cn placeholder="中文名（1–24 字）">
      <input data-tag-input-en placeholder="英文名（可留空）">
      <select data-tag-input-tone>${TAG_TONES.map(([v, label]) => `<option value="${v}">${label}</option>`).join('')}</select>
      <input data-tag-input-icon placeholder="图标（最多 8 字符）">
      <input data-tag-input-sort type="number" value="0" placeholder="排序">
    </div>
    <button type="button" data-save-tag class="navbtn" style="margin-top:8px" onclick="saveTag()">💾 保存标签</button>
  </div>
  <div class="chartbox" style="margin-top:12px">
    <b>给商品挂标签</b>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px">
      <select data-assign-sku onchange="loadProductTags()">${productOptions}</select>
      <span data-assign-chips style="display:flex;gap:6px;flex-wrap:wrap"></span>
      <button type="button" data-save-assignment class="navbtn" onclick="saveProductTags()">💾 保存关联</button>
    </div>

// 今天及之后（新加坡日期）按取餐／配送时间从早到晚排在前；历史订单排在后，最近的在前。
// 接口按下单时间倒序返回最近 500 单；无预约日期按下单的新加坡日期，无时刻排在同日有时刻之后。
function scheduleOrder(orders) {
  const sgDate = t => { const ms = new Date(t).getTime(); return Number.isFinite(ms) ? new Date(ms + 8 * 3600e3).toISOString().slice(0, 10) : ''; };
  const today = sgDate(Date.now());
  const key = o => (o.deliver_at || sgDate(o.created_at)) + ' ' + (o.deliver_time || '24:00');
  return orders.map(o => ({ o, k: key(o) })).sort((a, b) => {
    const pa = a.k.slice(0, 10) < today, pb = b.k.slice(0, 10) < today;
    if (pa !== pb) return pa ? 1 : -1;
    const c = a.k < b.k ? -1 : a.k > b.k ? 1 : 0;
    return (pa ? -c : c) || String(a.o.id).localeCompare(String(b.o.id));
  }).map(x => x.o);
}

async function _refundDeliveryFee(i) {
  const o = (window._adminOrders || [])[i]; if (!o) return;
  const fee = +(+o.delivery_fee || 0).toFixed(2);
  const bal = +(+o.paid_by_balance || 0);
  const ans = await confirmMoney({
    title: '💸 只退运费',
    bodyHtml: `<div>订单 <b>${esc(o.invoice_no || o.id)}</b>　顾客 ${esc(o.customer_name || '')}</div>
      <div style="margin-top:8px">本次退款 <b style="color:var(--red);font-size:19px">${money(fee)}</b>　（订单合计 ${money(o.total)}）</div>
      <ul style="margin:10px 0 0 18px;color:var(--ink);font-size:13px;line-height:1.8">
        <li><b>商品钱不退</b>，只退这一单的运费。</li>
        <li>顾客在线付的部分<b>原路退回</b>，银行 <b>3–10 个工作日</b>到账；<b>不是</b>立刻能看到。</li>
        ${bal > 0 ? '<li>用储值付的部分退回会员钱包，<b>立即可用</b>。</li>' : ''}
        <li>退款流水会记账，重复点击不会退第二次。</li>
      </ul>`,
    okText: '确认退运费 ' + money(fee),
    reason: true, reasonPlaceholder: '例：送晚了 / 送错地址',
  });
  if (!ans) return;
  const btn = document.getElementById('rdf-' + i);
  const restore = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = '退款中…'; }   // 防重复提交
  try {
    const r = await apiPost('/api/admin/refund-delivery-fee', { order_id: o.id, reason: ans.reason });
    if (!r.ok) {
      if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = restore; }
      alert('退运费失败：' + (r.error || '未知错误') + (r.code ? '\n（' + r.code + '）' : '') +
        (r.code === 'manual_required' ? '\n\n订单状态未改变，可以重试；如果仍失败，请到 Stripe 后台手动退这笔运费。' : ''));
      return;
    }
    const d = r.data;
    const refunded = +(+d.refunded || 0).toFixed(2);
    // deduped = 服务端认出这笔之前已经退过、这次没有再出账；再往已退合计上加一次就是虚增。
    o.refunded_total = d.deduped
      ? +Math.max(+o.refunded_total || 0, refunded).toFixed(2)
      : +((+o.refunded_total || 0) + refunded).toFixed(2);
    if (btn) btn.remove();   // 已退过 → 不再给第二次机会（和后端守卫一致）
    const badge = document.getElementById('ordref-' + i);
    if (badge) badge.innerHTML = refundedBadgeHtml(o.refunded_total, '已退运费');
    const det = document.getElementById('orddet-' + i);
    if (det && det.style.display !== 'none') loadOrderRefunds(i);
    alert(`✅ 已退运费 ${money(refunded)}${d.deduped ? '（这笔之前已经退过，没有重复退）' : ''}\n` +
      `· 原路退回 ${money(d.stripe_amount)}（银行 3–10 个工作日到账）\n` +
      `· 退回储值 ${money(d.balance_amount)}（立即可用）`);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = restore; }
    if (e.message !== 'unauthorized') alert('网络错误：' + e.message + '\n请刷新后到订单详情确认这笔退款到底有没有成功，再决定是否重试。');
  }
}

let RT_COMPUTED = null;
async function rtGeocode(postal){
  const d = await (await fetch('/api/onemap?postal='+encodeURIComponent(postal))).json();
  if (!d.found) return null;
  return { postal:d.postal, addr:d.address, lat:+d.lat, lng:+d.lng };
}
async function rtOsrm(from,to){
  const u = `https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=simplified&geometries=geojson`;
  const d = await (await fetch(u)).json();
  if (d.code!=='Ok' || !d.routes || !d.routes[0]) return null;
  const r = d.routes[0]; return { coords:r.geometry.coordinates, distance:r.distance, duration:r.duration };
}
async function rtArea(lat,lng){
  try {
    const d = await (await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=14&accept-language=en`)).json();
    const a = d.address||{}; return a.suburb||a.residential||a.town||a.city_district||a.quarter||a.neighbourhood||null;
  } catch(e){ return null; }
}
function rtSample(c,n){ if(c.length<=n) return c; const o=[]; for(let i=0;i<n;i++) o.push(c[Math.round(i*(c.length-1)/(n-1))]); return o; }
function rtPin(emoji){ return L.divIcon({ html:`<div style="font-size:24px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))">${emoji}</div>`, className:'', iconSize:[24,24], iconAnchor:[12,22] }); }

window.computeRoute = async () => {
  const fromP = (pcv('rt-from')||'').replace(/\D/g,''), toP = (pcv('rt-to')||'').replace(/\D/g,'');
  if (!/^\d{6}$/.test(fromP) || !/^\d{6}$/.test(toP)) return alert('请输入有效的 6 位起点/终点邮编');
  const btn = document.getElementById('rt-calc'), status = document.getElementById('rt-status');
  btn.disabled = true; btn.textContent = '计算中…';
  try {
    status.textContent = '① 定位起点/终点邮编…';
    const from = await rtGeocode(fromP), to = await rtGeocode(toP);
    if (!from || !to) throw new Error('邮编无法定位');
    status.textContent = '② 规划行车路线…';
    const line = await rtOsrm(from,to); if (!line) throw new Error('无法规划行车路线');
    status.textContent = '③ 识别沿途区域…（约 6 秒）';
    const pts = rtSample(line.coords, 6), areas = [];
    for (const [lng,lat] of pts){ const a = await rtArea(lat,lng); if (a && areas[areas.length-1] !== a) areas.push(a); await new Promise(r=>setTimeout(r,1100)); }
    const seen = new Set(), ord = []; for (const a of areas){ if(!seen.has(a)){ seen.add(a); ord.push(a); } }
    RT_COMPUTED = { from_postal:from.postal, to_postal:to.postal, from_addr:from.addr, to_addr:to.addr,
      from_lat:from.lat, from_lng:from.lng, to_lat:to.lat, to_lng:to.lng,
      geometry:line.coords, areas:ord, distance_m:Math.round(line.distance), duration_s:Math.round(line.duration) };
    renderRtPreview();
    status.innerHTML = '<b style="color:var(--green)">✓ 已计算，确认无误即可发布</b>';
    document.getElementById('rt-publish').disabled = false;
  } catch(e){ status.innerHTML = '<b style="color:var(--red)">✗ '+e.message+'</b>'; }
  finally { btn.disabled = false; btn.textContent = '① 计算路线'; }
};
function renderRtPreview(){
  const c = RT_COMPUTED; if(!c) return;
  document.getElementById('rt-preview').style.display = 'block';
  document.getElementById('rt-areas').innerHTML =
    '途经 <b>'+(c.areas.join(' → ')||'—')+'</b> · '+(c.distance_m/1000).toFixed(1)+' km · 约 '+Math.round(c.duration_s/60)+' 分钟';
  if (window._rtMap){ window._rtMap.remove(); window._rtMap = null; }
  // container just switched display:none -> block; init on next frame so Leaflet sees real size
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const map = L.map('rt-map');
    L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png',{minZoom:11,maxZoom:18,attribution:'© OneMap & SLA'}).addTo(map);
    const latlngs = c.geometry.map(([lng,lat])=>[lat,lng]);
    const poly = L.polyline(latlngs,{color:'#B98A2F',weight:5,opacity:.9}).addTo(map);
    L.marker([c.from_lat,c.from_lng],{icon:rtPin('🍽️')}).addTo(map).bindPopup('起点 '+c.from_postal);
    L.marker([c.to_lat,c.to_lng],{icon:rtPin('📍')}).addTo(map).bindPopup('终点 '+c.to_postal);
    map.invalidateSize();
    map.fitBounds(poly.getBounds().pad(0.15));
    window._rtMap = map;
  }));
}

window.searchTopupMembers = async () => {
  const q=pcv('tu-member-q');
  clearTimeout(TOPUP_MEMBER_SEARCH_TIMER);
  if(!q){ TOPUP_MEMBER_RESULTS=[]; const box=document.getElementById('tu-member-results'); if(box) box.style.display='none'; return; }
  const requestId=++TOPUP_MEMBER_SEARCH_REQUEST;
  try {
    const d=await api('/api/admin/members?q='+encodeURIComponent(q));
    if(requestId!==TOPUP_MEMBER_SEARCH_REQUEST) return;
    TOPUP_MEMBER_RESULTS=(d.members||[]).slice(0,8);
    renderTopupMemberResults();
    if(!TOPUP_MEMBER_RESULTS.length){
      const phone=document.getElementById('tu-phone'), name=document.getElementById('tu-name'), email=document.getElementById('tu-email');
      const digits=q.replace(/\D/g,'');
      if(phone&&!phone.value&&(/^[89]\d{7}$/.test(digits)||/^65[89]\d{7}$/.test(digits))) phone.value=q;
      else if(email&&!email.value&&q.includes('@')) email.value=q;
      else if(name&&!name.value) name.value=q;
    }
  } catch(e){ if(e.message!=='unauthorized'){ TOPUP_MEMBER_RESULTS=[]; renderTopupMemberResults(); } }
};

window.doTopup = async () => {
  const selected=TOPUP_SELECTED_MEMBER, phone=pcv('tu-phone'), name=pcv('tu-name'), email=pcv('tu-email'), amount=+pcv('tu-amt');

  const btn = document.getElementById('topup-btn'); if (btn) btn.disabled = true;   // 防双击双充：禁用后第二次点击不触发(disabled 按钮不发 click)；成功重渲染、失败下面恢复

    const d = await (await fetch('/api/admin/topup',{method:'POST',headers:{authorization:'Bearer '+TOKEN,'content-type':'application/json'},body:JSON.stringify(body)})).json();

  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();

    window.BRAND_LOGO=c.toDataURL('image/png'); document.getElementById('brandLogoPrev').src=window.BRAND_LOGO; }; img.src=e.target.result; };
  rd.readAsDataURL(f);
};

const DRINK_COMPONENT = 'DRINK';

window.componentsSummary = list => (list || []).map(c => `${productNameBySku(c.sku)}×${c.qty}`).join(' · ');
window.renderComponentsEditor = (p) => {
  const box = document.getElementById('prodComponents');
  if (!box) return;
  const self = p ? p.sku : '';
  const current = (p && p.components) || [];
  const qtyOf = Object.fromEntries(current.map(c => [c.sku, c.qty]));
  // 可选成分：单品和饮品（不含自身、不含套餐/单人餐/家庭装和本身有组成的商品，套餐里不再套套餐）；已选的按原顺序排在前面
  const candidates = (window.PRODUCT_ITEMS || []).filter(x => x.sku !== self && !(x.components || []).length)
    .map(x => ({ sku: x.sku, label: x.name_cn + (x.active ? '' : '（已下线）') }));
  candidates.push({ sku: DRINK_COMPONENT, label: '任选饮品（顾客从在售饮品里选）' });
  const order = [...current.map(c => c.sku), ...candidates.map(c => c.sku).filter(sku => !(sku in qtyOf))];
  const bySku = Object.fromEntries(candidates.map(c => [c.sku, c]));
  box.innerHTML = order.map(sku => {
    const label = bySku[sku] ? bySku[sku].label : productNameBySku(sku);
    return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid #E6D7A8;border-radius:8px;padding:4px 8px;background:${qtyOf[sku] ? '#F4EFD9' : '#fff'}">
      <input type="number" min="0" max="99" step="1" data-component-sku="${esc(sku)}" value="${qtyOf[sku] || 0}" style="width:56px">
      <span>${esc(label)}</span></label>`;
  }).join('');
};
// 数量必须是 0–99 的整数；填错就报出来，不截断、不当 0 处理
const collectComponents = () => {
  const out = [];
  for (const el of document.querySelectorAll('#prodComponents [data-component-sku]')) {
    const raw = String(el.value).trim();
    if (!/^\d{1,2}$/.test(raw)) throw new Error(`组成数量必须是 0–99 的整数：${productNameBySku(el.dataset.componentSku)}（现在是「${raw}」）`);
    const qty = Number(raw);
    if (qty > 0) out.push({ sku: el.dataset.componentSku, qty });
  }
  return out;
};

    const p = MENU_ITEMS.find(x => x.sku === sku); if (p) p.active = active; renderMenuTool();
    document.getElementById('mtMsg').textContent = '✅ 上下架状态已保存到草稿，待发布后上线';
  } catch (e) { document.getElementById('mtMsg').textContent = '❌ ' + e.message; }
};
window.uploadPhoto = (sku, input) => {
  const file = input.files && input.files[0]; if (!file) return;
  const baseRevision = MENU_DRAFT_REVISION;
  const msg = document.getElementById('mtMsg'); msg.textContent = '处理图片中…';
  const im = new Image();
  im.onload = () => {
    const max = 600, scale = Math.min(1, max / Math.max(im.width, im.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(im.width * scale); cv.height = Math.round(im.height * scale);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    const dataurl = cv.toDataURL('image/jpeg', 0.82);
    apiSend('/api/admin/product-image', 'POST', { sku, dataurl, base_revision: baseRevision })
      .then(({ status, body: r }) => {
        if (status === 200 && r.ok) { MENU_DRAFT_REVISION = r.draft_revision; const p = MENU_ITEMS.find(x => x.sku === sku); if (p) p.img = dataurl; renderMenuTool(); document.getElementById('mtMsg').textContent = '✅ 照片已保存到草稿，待发布后上线'; }
        else document.getElementById('mtMsg').textContent = '❌ ' + (status === 409 ? DRAFT_CONFLICT_MESSAGE : r.error || '失败');
      }).catch(e => { document.getElementById('mtMsg').textContent = '❌ ' + e.message; });
  };
  im.onerror = () => { msg.textContent = '❌ 图片读取失败'; };
  const fr = new FileReader(); fr.onload = () => { im.src = fr.result; }; fr.readAsDataURL(file);
};

	      "$env:HL_TSPL_GAP_MM = '0'",
	      "$env:HL_TSPL_COLS = '32'",
	      "node kitchen-print-agent.mjs"

	    'npm install iconv-lite >/dev/null',
	    'curl -fsSL ' + adminShellQuote(source) + ' -o kitchen-print-agent.mjs',
	    'export HL_KITCHEN_URL=' + adminShellQuote(kitchenUrl),
	    'export HL_PRINT_MODE=tspl',
	    'export HL_PRINT_PRINTER=GP-3120TN',
	    'export HL_TSPL_WIDTH_MM=76',
	    'export HL_TSPL_HEIGHT_MM=120',
	    'export HL_TSPL_GAP_MM=0',
	    'export HL_TSPL_COLS=32',

	}

	window.copyText = async (text, label, srcEl) => {

	function bindPrintPreview(){
  const prof=document.getElementById('pkProfile'), font=document.getElementById('pkFont');
  const load=async()=>{
    const fontPx=font ? font.value : 12;
    const fv=document.getElementById('pkFontVal'); if(fv) fv.textContent=fontPx+'px';
    const r=await fetch('/api/admin/print-preview?profile='+encodeURIComponent(prof.value)+'&font_px='+encodeURIComponent(fontPx),{headers:{authorization:'Bearer '+TOKEN}});
    const d=await r.json();
    const pre=document.getElementById('pkPreview'), meta=document.getElementById('pkPreviewMeta');
    if(pre){
      pre.textContent=d.content||'';
      pre.style.fontSize=(d.profile.font_px||fontPx)+'px';
      pre.style.lineHeight=d.profile.line_height||1.45;
      // 按【列数】定宽，不按纸张 mm：小票是等宽字符排版，48 列在 72mm 里放不下 12px 的字，
      // 原来用 mm 定宽 + pre-wrap，结果每根 ==== 分隔线都被折成两行，预览看起来像票面坏了。
      // ch = 一个等宽字符宽；+22px 补 padding 10×2 与 border 1×2（全局 box-sizing:border-box）。
      pre.style.width=`calc(${(+d.profile.cols||48)}ch + 22px)`;
      pre.style.maxWidth='100%';
    }
    if(meta) meta.textContent=`${d.profile.label} · ${d.profile.cols} 列 · ${d.profile.width_mm}mm · ${d.profile.font_px}px`;
  };
  if(prof) prof.onchange=load;
  if(font) font.oninput=load;
  load().catch(e=>{ const meta=document.getElementById('pkPreviewMeta'); if(meta) meta.textContent='预览加载失败：'+e.message; });
}

    const prev = document.getElementById('stPickupPhotoPrev'); if (prev) { prev.style.opacity = '1'; prev.src = data; }

window.saveSettings = async () => {
  if (PICKUP_SETTINGS_SAVING) return;
  const msg = document.getElementById('stSaveMsg'), saveBtn = document.getElementById('stSaveBtn');
  lockPickupSettings(); msg.textContent = '检查照片中…';
  const photoFailures = await waitForPickupPhotoJobs();
  if (photoFailures.length) { msg.textContent = '❌ 图片未保存：' + photoFailures.map(x => x.error).join('；'); unlockPickupSettings(); return; }
  msg.textContent = '保存中…';
  // 收集营业时间：勾"营业"→[起,止]，不勾→null（休息）
  const bh = {};
  for (let d = 0; d < 7; d++) { const cb = document.querySelector(`.bh-open[data-d="${d}"]`);
    bh[d] = (cb && cb.checked) ? [document.querySelector(`.bh-from[data-d="${d}"]`).value, document.querySelector(`.bh-to[data-d="${d}"]`).value] : null; }
  // 营业结束须晚于开始（暂不支持跨夜营业；防手滑设成 20:00–08:00 → 后端会判整天无法下单）
  for (let d = 0; d < 7; d++) if (bh[d] && bh[d][1] <= bh[d][0]) {
    msg.textContent = ''; unlockPickupSettings(); alert(`${['周日','周一','周二','周三','周四','周五','周六'][d]} 营业结束时间必须晚于开始时间，请修正（暂不支持跨夜营业）`); return;
  }
  // NB: store_open is NOT sent here — it's only changed via the toggle button, so
  // saving config never accidentally flips the open/closed state.
  const body = {
    base_revision: STORE_DRAFT_REVISION,
    settings_revision: STORE_SETTINGS_REVISION,
    store_closed_msg: document.getElementById('stMsg').value,
    delivery_enabled: document.getElementById('dEnable').checked ? '1' : '0',
    pickup_enabled: document.getElementById('pEnable').checked ? '1' : '0',
    delivery_fee: document.getElementById('dFee').value,
    delivery_min: document.getElementById('dMin').value,
    delivery_free_above: document.getElementById('dFree').value,
    delivery_note: document.getElementById('dNote').value,
    delivery_areas: document.getElementById('dAreas').value,
    refund_max_days: +document.getElementById('dRefundDays').value || 0,
    refund_grace_manual_min: document.getElementById('dRefundGrace').value || '',
    block_partial_balance: document.getElementById('dBlockPartial').checked ? '1' : '0',
    pos_refund_delivery_fee: document.getElementById('dPosRefundFee').checked ? '1' : '0',
    gst_registered: document.getElementById('gstRegistered').checked ? '1' : '0',
    gst_rate: document.getElementById('gstRate').value || '9',
    service_charge_enabled: document.getElementById('svcEnabled').checked ? '1' : '0',
    service_charge_rate: document.getElementById('svcRate').value || '10',
    business_hours: JSON.stringify(bh),
    shop_name: document.getElementById('stShopName').value,
    shop_address: document.getElementById('stShopAddr').value,
    shop_pickup_detail: document.getElementById('stPickupDetail').value,
    shop_contact_phone: document.getElementById('stContactPhone').value,
    prep_time_min: document.getElementById('stPrepTime').value || '20',
    pickup_points: Array.from(document.querySelectorAll('.pickup-extra')).map(row => {
      const key = String(row.dataset.pickupIndex), photoUrl = row.querySelector('.pp-photo-url').value.trim();
      return { id:row.querySelector('.pp-id').value.trim(), active:row.querySelector('.pp-active').value==='1',
        name:row.querySelector('.pp-name').value.trim(), name_en:row.querySelector('.pp-name-en').value.trim(),
        address:row.querySelector('.pp-address').value.trim(), postal:row.querySelector('.pp-postal').value.replace(/\D/g,'').slice(0,6),
        detail:row.querySelector('.pp-detail').value.trim(), photo:photoUrl || PICKUP_POINT_PHOTOS[key] || '' };
    }),
  };
  const photoUrl = document.getElementById('stPickupPhotoUrl').value.trim();
  if (PICKUP_PHOTO !== null) body.shop_pickup_photo = PICKUP_PHOTO;
  else if (photoUrl && photoUrl !== PICKUP_PHOTO_ORIG) body.shop_pickup_photo = photoUrl;
  try {
    const r = await fetch('/api/admin/settings', { method: 'POST', headers: { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) { STORE_SETTINGS_REVISION = d.settings_revision; STORE_DRAFT_REVISION = d.draft_revision; msg.textContent = '✅ 已保存；公开内容仍是草稿，待发布后上线'; unlockPickupSettings(); }
    else { msg.textContent = '❌ ' + (r.status === 409 ? DRAFT_CONFLICT_MESSAGE : d.error || ('HTTP ' + r.status)); unlockPickupSettings(); }
  } catch (e) { msg.textContent = '❌ ' + e.message; unlockPickupSettings(); }
};

window.offQty = (sku, d, price) => {
  OFF_CART[sku] = Math.max(0, (OFF_CART[sku]?.qty || 0) + d);
  if (OFF_CART[sku] === 0) delete OFF_CART[sku]; else OFF_CART[sku] = { qty: OFF_CART[sku], price };
  document.getElementById('oq-' + sku).textContent = OFF_CART[sku]?.qty || 0;
  let t = 0; for (const k in OFF_CART) t += OFF_CART[k].qty * OFF_CART[k].price;
  document.getElementById('off-total').textContent = t.toFixed(2);
};
async function postOffline(body) {
  body.date = document.getElementById('off-date').value;
  body.pay_method = document.getElementById('off-pay').value;
  const r = await fetch('/api/admin/offline-sale', { method: 'POST', headers: { authorization: 'Bearer ' + TOKEN, 'content-type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
window.saveOfflineItems = async () => {
  const items = Object.entries(OFF_CART).map(([sku, v]) => ({ sku, qty: v.qty }));
  if (!items.length) return alert('请先选商品');
  const btn = document.getElementById('off-items-btn'); if (btn) btn.disabled = true;   // 防双击重复记单/重复计收入
  try {
    if (!_offItemsTok) _offItemsTok = crypto.randomUUID();
    const d = await postOffline({ items, client_token: _offItemsTok, menu_revision: OFF_REVISION });
    if (d.code === 'menu_changed') { _offItemsTok = null; alert((d.error || '菜单刚刚重新发布过，价格或组成可能已变。') + '\n\n页面将按当前菜单重新载入，请重新选择商品核对后再保存。'); offlineView(); return; }
    if (d.ok) { _offItemsTok = null; alert('已记录 ' + d.invoice_no + ' · S$ ' + d.total.toFixed(2)); offlineView(); } else { alert('失败：' + (d.error || '')); if (btn) btn.disabled = false; }
  } catch (e) { alert('网络错误'); if (btn) btn.disabled = false; }
};
window.saveOfflineLump = async () => {
  const amount = parseFloat(document.getElementById('off-amt').value);
  if (!amount) return alert('请填金额');
  const btn = document.getElementById('off-lump-btn'); if (btn) btn.disabled = true;   // 防双击重复记单/重复计收入
  try {
    if (!_offLumpTok) _offLumpTok = crypto.randomUUID();
    const d = await postOffline({ amount, count: parseInt(document.getElementById('off-cnt').value) || 1, note: document.getElementById('off-note').value, client_token: _offLumpTok });
    if (d.ok) { _offLumpTok = null; alert('已记录 ' + d.invoice_no + ' · S$ ' + d.total.toFixed(2)); offlineView(); } else { alert('失败：' + (d.error || '')); if (btn) btn.disabled = false; }

window.saveMember = async (i) => {
  const m = (window._adminMembers||[])[i] || {};
  const body = { user_id:m.user_id||null, phone:m.phone||null, name:document.getElementById('mn-' + i)?.value.trim() || '', birthday:document.getElementById('mb-' + i)?.value || null, admin_note:document.getElementById('mnote-' + i)?.value || '' };
  const btn=document.getElementById('msb-'+i), status=document.getElementById('ms-'+i);
  if(btn) btn.disabled=true;
  if(status){ status.style.color='var(--muted)'; status.textContent='保存中…'; }
  try {
    const r=await apiPost('/api/admin/member-save',body), d=r.data||{};
    if(r.ok&&d.ok){
      Object.assign(m,{name:body.name,birthday:body.birthday,admin_note:(d.member&&d.member.admin_note)||''});
      const note=document.getElementById('mnote-'+i); if(note) note.value=m.admin_note;
      if(status){ status.style.color='#246048'; status.textContent='✓ 已保存'; }
    } else if(status){ status.style.color='var(--red)'; status.textContent='保存失败：'+(r.error||''); }
  } catch(e){ if(e.message!=='unauthorized'&&status){ status.style.color='var(--red)'; status.textContent='保存失败：'+e.message; } }
  if(btn) btn.disabled=false;
};
window.memberTopupAudit = (i) => {
  const m=(window._adminMembers||[])[i]; if(!m) return;
  const q=m.user_id||m.phone||String(m.email||'').split(',')[0];
  if(!q) return alert('这位会员没有可用于查询充值记录的账号标识');
  TOPUP_AUDIT_FILTERS={q,method:'',since:'',until:'',offset:0,label:memberName(m)};
  TOPUP_AUDIT_FROM_MEMBER=true;
  topupView(true);
};

// ---------- 📋 单个会员的消费记录（资金流水 + 订单） ----------
window.memberLedgerView = async (i) => {
  const m0 = (window._adminMembers || [])[i];
  if (!m0) return;
  window._memberLedgerIdx = i;
  const back = '<button onclick="refreshMembers()" style="font-size:13px;padding:6px 12px">← 会员列表</button>';
  app.innerHTML = `<h1>📋 消费记录 &nbsp;${back}</h1><p style="color:var(--muted)">加载中…</p>`;
  let d;
  try { d = await api('/api/admin/member-ledger?' + memberQs(m0)); }
  catch (e) { if (e.message !== 'unauthorized') app.innerHTML = `<h1>📋 消费记录 &nbsp;${back}</h1><p>加载失败：${esc(e.message)}</p>`; return; }
  if (!d || d.error) { app.innerHTML = `<h1>📋 消费记录 &nbsp;${back}</h1><p style="color:var(--red)">${esc((d && d.error) || '加载失败')}</p>`; return; }
  const m = d.member || {};
  const lm = (window._adminMembers || [])[i];
  if (lm) { lm.balance = m.balance; lm.archived_at = m.archived_at; }   // 列表里的余额跟着一起对齐
  const w = d.wallet || {};
  const entries = w.entries || [];
  // ⚠️ balance_after_reliable === false 时服务端根本没给 balance_after 字段：
  // 整列隐藏并如实说明，绝不能拿 0/undefined 冒充余额糊弄老板。
  const unreliable = w.balance_after_reliable === false;
  const showAfter = !unreliable && entries.some(e => e.balance_after != null);
  const card = (label, val, sub, color) => `<div style="flex:1;min-width:130px;background:#fff;border:1px solid var(--gold2);border-radius:12px;padding:12px">
    <div style="color:var(--muted);font-size:12px">${esc(label)}</div><div style="font-size:20px;font-weight:800;color:${color||'var(--green)'}">${val}</div>
    ${sub ? `<div style="color:var(--muted);font-size:11px">${esc(sub)}</div>` : ''}</div>`;
  const walletRows = entries.map(e => {
    const k = String(e.kind || '');
    const delta = +e.delta || 0;
    const bits = [];
    if (k === 'topup' && e.principal != null) bits.push(`本金 ${money(e.principal)}${+e.bonus > 0 ? ' + 赠送 ' + money(e.bonus) : ''}`);
    if (e.invoice_no) bits.push('单号 ' + e.invoice_no);
    // 只有充值才报付款渠道；调整/退款那几类 method 恒为 'wallet'，写出来是废话
    if (e.method && k === 'topup') bits.push(PAY_LABEL[e.method] || e.method);
    if (e.note) bits.push(e.note);
    return `<tr><td style="white-space:nowrap">${esc(sgt(e.created_at))}</td>
      <td><span class="badge" style="background:#EFE9D8;color:${WALLET_KIND_COLOR[k] || 'var(--ink)'}">${esc(WALLET_KIND[k] || k || '其他')}</span></td>
      <td style="white-space:nowrap"><b style="color:${delta < 0 ? 'var(--red)' : '#246048'};font-size:14px">${delta < 0 ? '−' : '+'}${money(Math.abs(delta))}</b></td>
      <td style="white-space:normal;max-width:280px">${bits.length ? esc(bits.join('　·　')) : '<span style="color:var(--muted)">—</span>'}</td>
      ${showAfter ? `<td style="white-space:nowrap">${e.balance_after == null ? '<span style="color:var(--muted)">—</span>'
        : `<b style="color:${+e.balance_after < 0 ? 'var(--red)' : 'var(--ink)'}">${money(e.balance_after)}</b>`}</td>` : ''}</tr>`;
  }).join('');
  const orders = d.orders || [];
  const orderRows = orders.map(o => {
    const st = fulfilOf(o);
    const ps = String(o.pay_status || '');
    const fee = +o.delivery_fee || 0;
    return `<tr><td><a href="/invoice/${esc(o.id)}" target="_blank">${esc(o.invoice_no || o.id)}</a></td>
      <td style="white-space:nowrap">${esc(sgt(o.created_at))}</td>
      <td style="white-space:nowrap">${money(o.total)}${fee > 0 ? `<br><span style="color:var(--muted);font-size:11px">含运费 ${money(fee)}</span>` : ''}${+o.paid_by_balance > 0 ? `<br><span style="color:var(--muted);font-size:11px">用储值 ${money(o.paid_by_balance)}</span>` : ''}${refundedBadgeHtml(o.refunded_total)}</td>
      <td>${esc(PAY_LABEL[o.pay_provider] || o.pay_provider || '—')}</td>
      <td><span class="badge ${esc(ps)}">${esc(ps || '—')}</span></td>
      <td><span class="badge" style="background:#EFE9D8;color:${FULFIL_COLOR[st]}">${FULFIL_LABEL[st]}</span></td></tr>`;
  }).join('');
  const spent = entries.filter(e => (+e.delta || 0) < 0).reduce((s, e) => s + Math.abs(+e.delta || 0), 0);
  const gained = entries.filter(e => (+e.delta || 0) > 0).reduce((s, e) => s + (+e.delta || 0), 0);
  app.innerHTML = `<h1>📋 消费记录 · ${esc(memberName(m))} &nbsp;${back}</h1>
    ${m.archived_at ? `<div style="border:1.5px solid #A23B2D;background:#F8DED7;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px">
      🗄️ 这位会员已于 <b>${esc(sgt(m.archived_at))}</b> 归档，默认不出现在会员列表里。账目和订单都还在，可在列表勾选「显示已归档」后恢复。</div>` : ''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      ${card('手机号', esc(m.phone || '—'), m.user_id ? '有账号' : '无账号（legacy）')}
      ${card('储值余额', money(m.balance), '店里欠顾客的钱', '#B98A2F')}
      ${card('积分', String(m.points || 0), '')}
      ${card('累计消费', money(m.total_spent), (m.orders_count || 0) + ' 单', '#246048')}
      ${card('入会时间', esc(sgt(m.created_at, 10) || '—'), '')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button class="navbtn" id="madj-${i}" style="background:#B98A2F" onclick="adjustMember(${i})">💰 调整余额</button>
      <button class="navbtn" style="background:#7A4DA8" onclick="memberTopupAudit(${i})">💳 查看充值记录</button>
      ${m.archived_at
        ? `<button class="navbtn" id="march-${i}" style="background:#246048" onclick="restoreMember(${i})">↩️ 恢复这位会员</button>`
        : `<button class="navbtn" id="march-${i}" style="background:#A23B2D" onclick="archiveMember(${i})">🗄️ 归档这位会员</button>`}
    </div>
    <div class="chartbox"><div class="chart-h">💰 资金流水（充值 / 消费 / 退款 / 手动调整）</div>
      ${entries.length ? `<p style="color:var(--muted);font-size:12px;margin-bottom:8px">共 ${entries.length} 笔　·　进账合计 <b style="color:#246048">${money(gained)}</b>　·　出账合计 <b style="color:var(--red)">${money(spent)}</b>${w.truncated ? '　·　<b style="color:#B98A2F">记录过多，只显示最近 500 笔</b>' : ''}</p>` : ''}
      ${unreliable ? `<div style="border:1.5px solid #B98A2F;background:#FBF3DF;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.7">
        ⚠️ <b>余额明细暂时无法核对</b>：这本流水逐笔累加出来是 <b>${money(w.computed_balance)}</b>，和当前余额 <b>${money(m.balance)}</b> 对不上（或记录太多被截断）。
        因此「变动后余额」这一列<b>不显示</b> —— 宁可不给数，也不能给一个错的余额。当前余额以上方 <b>${money(m.balance)}</b> 为准，差额请到「💰 储值台账」核查。</div>` : ''}
      ${entries.length ? `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table><thead><tr><th>时间</th><th>类型</th><th>金额</th><th>说明</th>${showAfter ? '<th>变动后余额</th>' : ''}</tr></thead><tbody>${walletRows}</tbody></table></div>`
        : emptyBox('🧾', '这位会员还没有任何资金往来', '充值、用储值付款、退款、老板手动调整，都会出现在这里。')}
    </div>
    <div class="chartbox"><div class="chart-h">🧾 订单（${orders.length} 笔${orders.length >= 100 ? '，只显示最近 100 笔' : ''}）</div>
      ${orders.length ? `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table><thead><tr><th>单号</th><th>时间</th><th>金额</th><th>支付方式</th><th>付款状态</th><th>厨房状态</th></tr></thead><tbody>${orderRows}</tbody></table></div>`
        : emptyBox('📦', '这位会员还没下过单', '不管线上下单还是收银台录的线下单，只要挂在这个会员名下都会列在这里。')}
    </div>`;
};

// ---------- 💰 手动加/减会员余额（动真钱：两步确认 + 幂等令牌 + 防重复提交） ----------
window.adjustMember = async (i) => {
  if (MONEY_BUSY) return;
  MONEY_BUSY = true;
  try { await _adjustMember(i); } finally { MONEY_BUSY = false; }
};
async function _adjustMember(i) {
  const m = (window._adminMembers || [])[i];
  if (!m) return;
  const bal = +(+m.balance || 0).toFixed(2);
  const form = await formDialog({
    title: '调整会员余额',
    okText: '下一步：核对',
    okColor: '#B98A2F',
    bodyHtml: `<div>会员 <b>${esc(memberName(m))}</b>　${esc(m.phone || '')}</div>
      <div style="margin-top:6px">当前余额 <b style="color:#B98A2F;font-size:19px">${money(bal)}</b></div>
      <div class="field" style="margin-top:12px;display:grid;gap:10px">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)">加还是减
          <select id="maAct"><option value="subtract">➖ 减少余额（扣款）</option><option value="add">➕ 增加余额（补款）</option></select></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)">金额 S$
          <input id="maAmt" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="例：10.00"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)">原因（会写进储值流水，顾客来对账时看得到）
          <input id="maNote" maxlength="200" placeholder="例：现金退还顾客 / 补录漏扣的一单"></label>
      </div>
      <div id="maErr" style="color:var(--red);font-size:13px;margin-top:8px"></div>`,
    collect: (wrap) => {
      const action = wrap.querySelector('#maAct').value;
      const amount = +(+wrap.querySelector('#maAmt').value || 0).toFixed(2);
      if (!(amount > 0)) { wrap.querySelector('#maErr').textContent = '请填写大于 0 的金额。'; return false; }
      return { action, amount, note: wrap.querySelector('#maNote').value.trim() };
    },
  });
  if (!form) return;
  const delta = form.action === 'subtract' ? -form.amount : form.amount;
  const after = +(bal + delta).toFixed(2);
  const sub = delta < 0;
  const ans = await confirmMoney({
    title: sub ? '⚠️ 确认扣减会员余额' : '确认增加会员余额',
    bodyHtml: `<div>会员 <b>${esc(memberName(m))}</b>　${esc(m.phone || '')}</div>
      <div style="margin-top:12px;background:#FBF7EC;border:1px solid var(--gold2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:13px;color:var(--muted)">当前余额<br><b style="font-size:19px;color:var(--ink)">${money(bal)}</b></span>
        <span style="font-size:22px;color:var(--muted)">→</span>
        <span style="font-size:13px;color:var(--muted)">调整后余额<br><b style="font-size:22px;color:${after < 0 ? 'var(--red)' : 'var(--ink)'}">${money(after)}</b></span>
      </div>
      <div style="margin-top:10px">本次${sub ? '扣减' : '增加'} <b style="color:${sub ? 'var(--red)' : '#246048'};font-size:19px">${sub ? '−' : '+'}${money(form.amount)}</b></div>
      <div style="margin-top:6px;font-size:13px;color:var(--muted)">原因：${esc(form.note || '（未填，流水里会记成「老板手动' + (sub ? '减少' : '增加') + '余额」）')}</div>
      ${after < 0 ? '<div style="margin-top:10px;color:var(--red);font-size:13px"><b>⛔ 余额不够扣</b>，服务端会拒绝这笔操作（储值不许扣成负数）。</div>' : ''}
      <ul style="margin:10px 0 0 18px;font-size:13px;line-height:1.8">
        <li>这笔会写进储值流水（类型「手动调整」），顾客拿手机来对账时看得到。</li>
        <li>${sub ? '扣款' : '加款'}立刻生效，<b>不经过 Stripe</b>；要把真金退回顾客银行卡请走订单退款。</li>
      </ul>`,
    okText: (sub ? '确认扣减 ' : '确认增加 ') + money(form.amount),
    okColor: sub ? '#A23B2D' : '#246048',
  });
  if (!ans) return;
  const btn = document.getElementById('madj-' + i);
  const restore = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = '处理中…'; }   // 防重复提交
  const unlock = () => { if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = restore; } };
  try {
    // 每次点「确认」都发一个新令牌：同一次点击的网络重试会被服务端去重，两次真实点击则各算一笔。
    const body = Object.assign(memberKey(m), { action: form.action, amount: form.amount, note: form.note, client_token: crypto.randomUUID() });
    const r = await apiPost('/api/admin/member-balance-adjust', body);
    if (!r.ok) {
      unlock();
      // 余额不足 / 令牌冲突 / 找不到人：服务端文案原样端给老板，不改写不吞。
      alert('❌ 余额没有调整：' + (r.error || '未知错误') + (r.code ? '\n（' + r.code + '）' : '') + '\n\n余额没有变动，可以修改后重试。');
      return;
    }
    const dd = r.data || {};
    if (dd.deduped) {
      alert('ℹ️ 这笔已经处理过了，没有重复扣款。\n当前余额 ' + money(dd.balance));
    } else {
      alert('✅ 已' + (dd.delta < 0 ? '扣减 ' : '增加 ') + money(Math.abs(dd.delta)) +
        '\n· 调整前 ' + money(dd.balance_before) + ' → 现在 ' + money(dd.balance) +
        '\n· 已写入储值流水（手动调整）');
    }
    if (m) m.balance = dd.balance;
    const cell = document.getElementById('mbal-' + i);
    if (cell) cell.innerHTML = balHtml(dd.balance);   // 就地刷新这一行的余额，不打断老板正在看的列表
    unlock();
    if (window._memberLedgerIdx === i) memberLedgerView(i);   // 消费记录开着就顺手重画，流水里能立刻看到这笔
  } catch (e) {
    unlock();
    if (e.message !== 'unauthorized') alert('网络错误：' + e.message + '\n请刷新后到「消费记录」确认这笔调整到底有没有生效，再决定是否重试。');
  }
}

// ---------- 🗄️ 归档 / 恢复会员（老板嘴里的「删除」，实际保留全部账目） ----------
window.archiveMember = async (i) => {
  if (MONEY_BUSY) return;
  MONEY_BUSY = true;
  let next = null;
  try { next = await _archiveMember(i); } finally { MONEY_BUSY = false; }
  if (next === 'adjust') adjustMember(i);   // 有余额挡住了，直接把老板送进「调整余额」
};
async function _archiveMember(i) {
  const m = (window._adminMembers || [])[i];
  if (!m) return null;
  const bal = +(+m.balance || 0).toFixed(2);
  const ans = await confirmMoney({
    title: '🗄️ 归档会员（列表里不再显示）',
    bodyHtml: `<div>会员 <b>${esc(memberName(m))}</b>　${esc(m.phone || '')}</div>
      <div style="margin-top:8px">储值余额 ${balHtml(m.balance)}　累计消费 ${money(m.total_spent)}　${m.orders_count || 0} 单</div>
      ${bal > 0 ? `<div style="margin-top:10px;border:1.5px solid #A23B2D;background:#F8DED7;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7">
        ⚠️ 这位会员还有 <b style="color:var(--red)">${money(bal)}</b> 储值 —— 那是<b>店里欠顾客的钱</b>。归档不会把这笔钱抹掉，它照样算进储值负债，只是人从列表里消失了。<br>
        建议先<b>取消</b>，用「💰 调整余额」退还或扣减到 0（流水里留下去向），再回来归档。</div>` : ''}
      <ul style="margin:10px 0 0 18px;font-size:13px;line-height:1.8">
        <li>归档后<b>后台会员列表里不再显示</b>这个人，勾选「显示已归档」才看得到。</li>
        <li><b>历史订单和账目全部保留</b>，营收、储值台账、对账数字都不会变。</li>
        <li>随时可以<b>恢复</b>，恢复后一切照旧。</li>
        ${bal > 0 ? '<li>归档时的余额会原样写进<b>归档原因</b>，事后查得到这笔钱当时挂在谁头上。</li>' : '<li>这位会员余额为 0，归档不涉及任何欠款。</li>'}
      </ul>`,
    okText: bal > 0 ? '仍然归档（' + money(bal) + ' 留在账上）' : '确认归档',
    okColor: '#A23B2D',
    reason: true, reasonLabel: '归档原因（可留空，会存进会员档案）', reasonPlaceholder: '例：顾客要求删除 / 重复账号',
  });
  if (!ans) return null;
  const btn = document.getElementById('march-' + i);
  const restore = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = '处理中…'; }   // 防重复提交
  const unlock = () => { if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = restore; } };
  try {
    const r = await apiPost('/api/admin/member-archive', Object.assign(memberKey(m), { reason: ans.reason }));
    if (!r.ok) {
      unlock();
      // 后端如果开着「有余额不许归档」的闸门（409 has_balance），把服务端原话端出来并把老板送去调整余额。
      if (r.code === 'has_balance') {
        const go = await confirmMoney({
          title: '⛔ 这位会员还不能归档',
          bodyHtml: `<div style="color:var(--red);font-weight:700">${esc(r.error)}</div>
            <ul style="margin:10px 0 0 18px;font-size:13px;line-height:1.8">
              <li>储值余额是<b>店里欠顾客的钱</b>，人一归档、钱还挂在账上，储值台账会出现一笔查不到人的负债。</li>
              <li>正确顺序：先「💰 调整余额」把钱退还顾客并扣减到 0（流水里留下去向），再来归档。</li>
            </ul>`,
          okText: '去调整余额', okColor: '#B98A2F',

async function _refundOrder(i) {
  const o = (window._adminOrders || [])[i]; if (!o) return;
  const total = +(+o.total || 0).toFixed(2);
  const bal = +(+o.paid_by_balance || 0).toFixed(2);
  const already = +(+o.refunded_total || 0).toFixed(2);
  const paid = o.pay_status === 'PAID';
  // 后端整单退款退的是【剩余可退】= 合计 − 已退合计，不是合计本身。
  // 弹层上按合计报数的话，退过运费的单会多报一截金额（老板照着数字去 Stripe 对账就对不上）。
  const remaining = +Math.max(0, total - already).toFixed(2);
  if (paid && !(remaining > 0)) { alert('这单已经全额退过了，没有可退金额。'); return; }
  // 原路/储值预估：Stripe 那部分要减掉【已经原路退掉的】。退过款的单去查一次流水拿准确数。
  let alreadyStripe = 0;
  if (paid && already > 0) {
    try {
      const d = await api('/api/admin/order-refunds?order_id=' + encodeURIComponent(o.id));
      alreadyStripe = (d.refunds || []).filter(r => r.status === 'succeeded')
        .reduce((s, r) => s + (+r.stripe_amount || 0), 0);
    } catch (e) { if (e.message === 'unauthorized') return; }
  }
  const stripeLeft = +Math.max(0, total - bal - alreadyStripe).toFixed(2);
  const online = +Math.min(remaining, stripeLeft).toFixed(2);
  const toWallet = +Math.max(0, remaining - online).toFixed(2);
  const ans = await confirmMoney({
    title: paid ? '⚠️ 整单退款（原路退回真钱）' : '作废未付款订单',
    bodyHtml: `<div>订单 <b>${esc(o.invoice_no || o.id)}</b>　顾客 ${esc(o.customer_name || '')}</div>
      <div style="margin-top:8px">订单合计 ${money(total)}${already > 0 ? `　已退 <b style="color:var(--red)">${money(already)}</b>` : ''}</div>
      ${paid ? `<div style="margin-top:6px">本次退款 <b style="color:var(--red);font-size:19px">${money(remaining)}</b>${already > 0 ? '（只退剩余可退部分）' : ''}</div>
      <ul style="margin:10px 0 0 18px;font-size:13px;line-height:1.8">
        <li>预计<b>原路退回</b> ${money(online)}（Stripe 退回顾客付款方式，银行 <b>3–10 个工作日</b>到账）。</li>
        <li>预计<b>退回储值</b> ${money(toWallet)}（立即可用）。</li>
        <li>实际拆分以退款完成后服务端返回为准；只有两边都退成功，订单才会变成 REFUNDED。</li>
        <li style="color:var(--red)"><b>这是真金白银出账，确认前请核对单号。</b></li>
      </ul>` : `<ul style="margin:10px 0 0 18px;font-size:13px;line-height:1.8">
        <li>这单尚未付款，操作后作废并释放优惠码名额。</li>
        <li>${bal > 0 ? `退回会员储值 <b>${money(bal)}</b>（立即可用）。` : '此单未用储值，不涉及退钱。'}</li>
      </ul>`}`,
    okText: paid ? '确认退款 ' + money(remaining) : '确认作废',
    reason: true, reasonPlaceholder: '例：顾客取消 / 商品缺货',
  });
  if (!ans) return;
  const btn = document.getElementById('rfo-' + i);
  const restore = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = '处理中…'; }   // 防重复提交
  try {
    const r = await apiPost('/api/admin/order-refund', { order_id: o.id, reason: ans.reason });
    if (!r.ok) {
      if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = restore; }
      const manual = r.code === 'manual_required' || r.http === 502;
      alert('❌ 退款没有成功：' + (r.error || '未知错误') + (r.code ? '\n（' + r.code + '）' : '') +
        (manual ? '\n\n订单状态未改变，钱可能一分都没退出去。可以稍后重试；如果重试仍失败，请到 Stripe 后台手动处理这笔退款。'
          : '\n\n订单状态未改变，请刷新后确认再重试。'));
      return;
    }
    const d = r.data;
    const done = d.status === 'REFUNDED' ? '退款' : '作废';
    // 作废未付款单（UNPAID→CANCELLED）服务端只返回 refunded，没有 stripe/balance 拆分；
    // 照着 money(undefined) 打印会变成「退回储值 S$0.00」，明明退了储值却说 0，老板会以为没退成。
    const hasSplit = d.stripe_amount != null || d.balance_amount != null;
    alert(`✅ 已${done} ${money(d.refunded)}${d.deduped ? '（之前已退过，没有重复退）' : ''}` +
      (hasSplit
        ? `\n· 原路退回 ${money(d.stripe_amount)}（银行 3–10 个工作日到账）\n· 退回储值 ${money(d.balance_amount)}（立即可用）`
        : (+d.refunded > 0 ? '\n· 全额退回会员储值（立即可用）' : '\n· 此单未付款、未用储值，不涉及退钱')) +
      (d.stripe_refund_id ? `\n· Stripe 退款号 ${d.stripe_refund_id}` : ''));
    dashFromFilters();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = restore; }
    if (e.message !== 'unauthorized') alert('网络错误：' + e.message + '\n请刷新后到订单详情确认这笔退款到底有没有成功，再决定是否重试。');
  }
}

// ================= 💳 历史储值：把按手机号记账的老会员余额并进他的登录账号 =================
// 账号模型从「手机号=身份」改成「user_id=身份」之后，老会员的钱还挂在 members 的 legacy 行上
// （user_id IS NULL）。顾客换成 Google/Apple 登录，新账号查不到那笔钱 —— 钱没丢，但他看到的是 0，
// 也花不掉。两边只有老板能接起来，这一页就是那个入口。
const LEGACY_CLAIM_STATUS = { pending: '等顾客输码', awaiting_approval: '等老板批准', committed: '已合并', cancelled: '已取消', expired: '已过期' };
// ⚠️ 撤销名单为什么存在本机：服务端没有任何接口会把 legacy_merges.id 列出来，merge_id 只在
// 合并成功那一刻的响应里出现一次。所以这份「可撤销」清单是本浏览器记下来的，只覆盖
// 【从这台机器的这个后台做过的合并】；换机器或清了浏览器数据就撤不了。界面上如实写明，不假装全量。
const LEGACY_LOG_KEY = 'hl_legacy_merges';
function legacyLogRead() {
  try { const v = JSON.parse(localStorage.getItem(LEGACY_LOG_KEY) || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function legacyLogWrite(list) { try { localStorage.setItem(LEGACY_LOG_KEY, JSON.stringify(list.slice(0, 50))); } catch (e) {} }
function legacyLogAdd(rec) {
  if (!rec || !rec.merge_id) return;
  const list = legacyLogRead().filter(x => x && x.merge_id !== rec.merge_id);
  list.unshift(rec); legacyLogWrite(list);
}
function legacyLogMark(mergeId, patch) {
  legacyLogWrite(legacyLogRead().map(x => (x && x.merge_id === mergeId) ? Object.assign({}, x, patch) : x));
}

function legacyMergeDone(d, ctx) {
  const moved = +(+(d.balance_moved || 0)).toFixed(2);
  legacyLogAdd({ merge_id: d.merge_id, phone: ctx.phone, balance_moved: moved,
    email: ctx.email || '', how: ctx.how || '', at: new Date().toISOString() });
  alert((d.deduped ? 'ℹ️ 这笔之前已经并过了，没有重复搬钱。\n\n' : '✅ 已并入\n\n') +
    '· 并入余额 ' + money(moved) + '\n' +
    (d.orders_moved != null ? '· 回填历史订单 ' + d.orders_moved + ' 张\n' : '') +
    (d.topups_moved ? '· 回填充值记录 ' + d.topups_moved + ' 笔\n' : '') +
    (d.points_moved ? '· 积分 ' + d.points_moved + '\n' : '') +
    '· 收款账号 ' + (ctx.email || d.user_id || '') + '\n' +
    (d.balance_after != null ? '· 该账号现在余额 ' + money(d.balance_after) + '\n' : '') +
    '\n顾客刷新一下就能看到这笔钱了。');

// 动钱按钮的通用外壳：禁用 + 文案变「处理中…」，失败恢复原状
function lockBtn(id) {
  const btn = document.getElementById(id);
  const restore = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; btn.textContent = '处理中…'; }
  return () => { if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.innerHTML = restore; } };
}
// 服务端错误一律原样端给老板，不改写不吞
function legacyFail(what, r) {
  alert('❌ ' + what + '：' + (r.error || '未知错误') + (r.code ? '\n（' + r.code + '）' : '') +
    (r.code === 'no_account' ? '\n\n请让顾客当面用 Google 或 Apple 登录一次，再用「🔗 绑定账号」按他的邮箱搜出来绑。' : '') +
    (r.code === 'claim_exists' ? '\n\n请到下方「🎫 认领票据」里处理那张票。' : '') +
    '\n\n钱没有动，可以刷新后重试。');
}

    legacyLogMark(rec.merge_id, { reversed: true, reversed_at: new Date().toISOString() });
    alert('✅ 已撤销这笔合并\n\n' +
      '· 退回 ' + money(d.balance_returned != null ? d.balance_returned : bal) + ' 到手机号 ' + (d.legacy_phone || rec.phone || '') + '\n' +
      (d.balance_after != null ? '· 那个账号现在余额 ' + money(d.balance_after) + '\n' : '') +
      '\n这笔钱又回到「待认领名单」里了，可以重新并给正确的人。');
    legacyView();
  } catch (e) {
    unlock();
    if (e.message !== 'unauthorized') alert('网络错误：' + e.message + '\n请刷新后确认这笔到底撤销了没有。');
  }
}

  const r = await apiPost('/api/admin/menu-categories', { categories: window.CAT_EDIT, base_revision: window.CAT_REVISION });
  if (!r.ok) { renderCategories('保存失败：' + r.error); return; }
  window.CAT_EDIT = r.data.categories; window.CAT_REVISION = r.data.draft_revision;
  renderCategories('已保存到草稿，发布后生效。');
};

// ═══════════════ 🔐 收银员 PIN（只存哈希，系统不附带任何默认 PIN） ═══════════════
window.posPinsView = async () => {
  const app = document.getElementById('app');
  app.innerHTML = '<p>加载中…</p>';
  let data;
  try { data = await api('/api/admin/pos-pins'); } catch (e) { if (e.message !== 'unauthorized') app.innerHTML = '<p>加载失败：' + esc(e.message) + '</p>'; return; }
  app.innerHTML = `<h1>🔐 收银员 PIN &nbsp;<button onclick="dash()" style="font-size:13px;padding:6px 12px">← 返回</button></h1>
    <p class="muted" style="font-size:13px">POS 登录用。PIN 为 6–12 位数字，只以哈希保存；连续输错 5 次锁定 15 分钟。</p>
    ${(data.cashiers || []).map(c => `<div style="display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap">
      <b style="width:60px">${esc(c.cashier)}</b><span style="width:150px;font-size:13px;color:${c.has_pin ? '#246048' : '#A23B2D'}">${c.has_pin ? '已设置 · ' + esc(sgt(c.updated_at, 10)) : '未设置（不能登录）'}</span>
      <input id="pin-${esc(c.cashier)}" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12" placeholder="新 PIN" style="width:130px">
      <button class="navbtn" style="padding:6px 12px" onclick="savePosPin('${esc(c.cashier)}')">保存</button>
      ${c.has_pin ? `<button style="color:#A23B2D" onclick="savePosPin('${esc(c.cashier)}', true)">停用</button>` : ''}</div>`).join('')}
    <p id="pinMsg" style="font-size:13px;color:#6E6650"></p>`;
};
window.savePosPin = async (cashier, disable) => {
  const pin = disable ? null : document.getElementById('pin-' + cashier).value.trim();
  const r = await apiPost('/api/admin/pos-pins', { cashier, pin });
  if (!r.ok) { document.getElementById('pinMsg').textContent = r.error; return; }
  posPinsView();
};

TOKEN ? dash() : loginView();
</script>
